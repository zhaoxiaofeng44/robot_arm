<script>
// ============================================================
// 仿生五指整手 — 5×掌段 + 14 个「肘关节机构」单元（关节方式与手指版逐件相同）
//   四指：掌段(300,固定,载电机0) ─O0─ P1(300) ─O1─ P2(300) ─O2─ P3(250,指尖)
//   拇指：掌段(300,固定,载电机0) ─O0─ P1(300) ─O1─ P2(250,指尖)   ← 少一个关节单元
//   单元k = 上级段(带电机k + 远端叉耳) + 本级段(近端袖套+D侧板) + BD长条连杆，几何零改动
//   14 关节 = 14 台 Ø36×80 直线电机全独立驱动；五指 MCP 共线于 y=0
//   掌体骨架 = 掌骨板A/B + 腕拼接块(腕接口) + 拇指连接肋，全部螺栓可拆（指根 4×M5 通用接口）
//   安全包络（由 verify_hand.cjs 三维姿态扫描确定）：四指 90°/90°/70°，拇指 90°/70°
// ============================================================
//   · 1:1 无缩放：手指版 1150mm 单指直接复用 → 整手为概念验证尺度（掌骨板 346mm 宽）
//   · B叉头：开放双耳+夹持桥（M6螺母沉龛），连杆沿Z落入、销轴沿Z插入
//   · D叉耳：侧板贴前臂侧面（在连杆Z带之外），取消跨连杆的桥
//   · 电机：前法兰承推（安装板与所在段一体）+ 后部开口抱箍（2×M4锁段侧）
// ============================================================
// --- 机构参数 ---
const P = {
  upperArmLen: 300,          // 掌段长（固定基节：载电机0，远端=关节0叉耳）
  phalanx1Len: 300,          // P1近节：单元0的被驱动段（与P2同构同长，载电机1）
  phalanx2Len: 300,          // P2中节：单元1的被驱动段（载电机2）
  forearmLen: 250,
  motorMountY: 213,          // A点：行程基准（拉压反力由前法兰承担）
  motorMountX: 28,
  motorBodyLen: 80,          // v5：缸体缩短为80mm（行程不变），给B关节让出装拆空间
  motorRearOverhang: 4,      // 缸体后端面越过A点距离（前端面=137，落在上臂近端段内）
  motorBodyRadius: 18,
  tendonLinkLen: 85,
  tendonEffLen: 85,
  forearmAttachDist: 31,
  forearmAttachOffset: 14,
  elbowPinRadius: 5,
  linkPinRadius: 4,
  scale: 0.35,
  // ===== 3D打印（FDM，0.4mm喷嘴）与可拆装工艺参数 =====
  // 孔=销径+2×单边间隙，孔轴统一沿Z（=打印方向）；关节轴向每侧留1mm浮动
  print: {
    radialClearance: 0.3,      // 转动配合单边间隙 mm
    axialClearance: 1.0,       // 每个端面的轴向浮动间隙 mm（v4为0.5，v5加大便于拆装）
    chamfer: 1.0,              // 孔口45°导入倒角 mm
    wallMin: 3.0,              // 结构最小壁厚 mm
    layerHeight: 0.2,
    // BD长条连杆
    linkWidth: 15,             // 等宽长条宽度 mm（端部R7.5与杆身同宽，无环眼凸台）
    linkThickness: 8,          // Z向厚度（层堆叠方向）
    // O肘
    earPlateThickness: 5,      // O叉耳耳片厚度
    earBossRadius: 10,         // O耳凸台半径（孔壁4.7）
    sleeveOuterDia: 20,        // 肘轴套外径（v4为22；Ø20使长条连杆全行程避让，壁厚4.7）
    sleeveThickness: 14,       // 轴套长度（耳内档16 − 2×1.0浮动）
    // B推杆叉头（独立打印件，螺母沉龛夹持电机推杆端螺纹）
    clevisPlateZ: 7,           // 叉耳板中心|z|（板厚4 → z=5..9）
    bridgeY0: 9, bridgeY1: 16, // 夹持桥y范围（B点上方9..16，避开连杆端部R7.5扫掠圆≥1.5mm）
    nutPocketAF: 10,           // M6螺母对边
    rodTipAboveB: 11.5,        // 推杆端部相对B点的下沉量（伸入沉龛，端面距龛底0.5mm）
    rodThreadLen: 12,          // 推杆端部螺纹段长度
    // D叉耳（与前臂上段同一打印件，侧板贴臂身侧面）
    dBossOD: 16, dBossT: 1,    // 内侧定位凸台（凸出1mm设定1mm轴向浮动）
    // 电机前法兰安装板（与上臂近端段一体；电机前法兰承推于其下面）
    flangePlateY0: 141, flangePlateT: 8,
    flangeBoltXZ: [[12,13],[12,-13],[44,13],[44,-13]],   // 4×M4（穿过电机法兰旋入安装板）
    // 电机后部开口抱箍（独立打印件，2×M4贯穿上臂侧面）
    collarY0: 175, collarY1: 217,
    collarWall: 3, collarGapDeg: 60, ringClearance: 0.2,   // 抱箍内径=Ø36+0.2夹持间隙
    collarBoltY: [184, 209],
    // 掌骨安装法兰（独立打印件：56×56 R8 圆角方板，坐在指根方块顶面 y=320）
    basePlateC: 28, basePlateRC: 8,  // 半宽28 → 56×56，转角R8
    basePlateT: 6,                   // 板厚（孔轴沿骨轴Y；rotX90打印时孔轴竖直）
    basePlateHoleDia: 4.4,           // 内圈 4×M4 过孔（穿板旋入指根方块 Ø3.4 底孔）
    basePlatePalmHoleR: 2.75,        // 外圈 4×Ø5.5 掌侧安装孔（44×44 对角）
    basePlateBolt: { shank: 4, len: 16, head: 7.2, headT: 4 },   // M4×16 内六角
    rootBoltXZ: [[8,7],[8,-7],[-8,7],[-8,-7]],   // 指根方块 4×M4 螺孔位（16×14 孔距，落在方块 24×22 内）
    // 可拆紧固件（外购标准件）：肩螺栓+平垫+尼龙自锁螺母
    boltElbow: { shank:10, shoulder:26, thread:8, head:16, headT:3,   washer:16, nutAF:13, nutH:6.5 }, // O
    boltB:     { shank:8,  shoulder:18, thread:6, head:14, headT:3,   washer:12, nutAF:10, nutH:5   }, // B
    boltD:     { shank:8,  shoulder:20, thread:6, head:14, headT:3,   washer:12, nutAF:10, nutH:5   }, // D（含1mm凸台）
    collarBolt:{ shank:4,  shoulder:22, thread:4, head:7.2, headT:3.6, washer:8,  nutAF:7,  nutH:3.2 }, // 抱箍2×M4
    // 一体化拼接（沿用v4）
    spliceYUpper: 140,
    spliceYForearm: -125,
    spliceFlangeT: 4,
    splicePadLen: 30,
    spliceLapPast: 5,
    spliceTongueLen: 15,
    spliceBoltDia: 4.4,
    spliceBoltInset: 4.5,      // 4.5+2.2=6.7 < 7（P2/P3 段/凸台半宽）→ 通孔完整落在实体内（5.0 会切到侧边、三角化会吃掉半个孔）
    spliceBoltOff: 6,
  },
};
const s = P.scale;
P.boreElbow = 2 * P.elbowPinRadius + 2 * P.print.radialClearance;    // Ø10.6
P.boreLink = 2 * P.linkPinRadius + 2 * P.print.radialClearance;      // Ø8.6
P.motorFrontY = P.motorMountY + P.motorRearOverhang - P.motorBodyLen; // 137：电机前端面/推杆出口

// --- 五指整手布局（1:1，与手指版同尺寸：掌段 300 + 指节 300/300/250） ---
//   四指各 3 个关节单元（掌指/近指/远指），拇指 2 个 → 共 14 个关节单元、14 台直线电机
//   五指的 MCP 关节共线（y=0），掌段沿 +y 伸到 y=326 的掌骨法兰，全部螺栓固定在同一块掌骨板上
//   spin = 绕手指自身长轴的滚转（fan = 绕掌骨轴的分指角）：五指一律 0 → 五个机构平面互相平行，
//     平面间距 = spacing = 70mm；拇指靠 z=-220 的基节位置体现“对掌侧”布置（见 hand_design_spec.md）
//     注：曾试拇指 spin=-30° 的“对掌滚转”，verify_hand.cjs 三维扫描 + 3D 实体求交证实其末节在屈曲约 36°
//     时即扫入食指机构平面（z≈-107 vs 食指 z=-90）→ 已回退为 0，对掌位应由腕侧自由度解决
const HAND = {
  spacing: 70,                 // 相邻手指机构平面（z）间距
  plateY0: P.upperArmLen + 26, // 326：掌骨板底面 = 各指掌骨法兰顶面（零间隙贴合）
  plateT: 10,                  // 掌骨板厚（y=326..336）
  wristY1: 352,                // 腕法兰顶面（y=336..352）
  fingers: [
    { key:'index',  label:'食指',  n:3, pos:[0,0, -90], fan:0, spin:0,   limits:[90,90,70] },
    { key:'middle', label:'中指',  n:3, pos:[0,0, -20], fan:0, spin:0,   limits:[90,90,70] },
    { key:'ring',   label:'无名指', n:3, pos:[0,0,  50], fan:0, spin:0,   limits:[90,90,70] },
    { key:'pinky',  label:'小指',  n:3, pos:[0,0, 120], fan:0, spin:0,   limits:[90,90,70] },
    { key:'thumb',  label:'拇指',  n:2, pos:[0,0,-220], fan:0, spin:0  , limits:[90,70]    },
  ],
  plateZ0: -253, plateZ1: 153, // 掌骨板 z 范围（指根外沿 + 33 余量）
  plateSplit: -55,             // 掌骨板打印分缝：落在无指根法兰的 z 空档 −62..−48 内（198/208mm 两件）
  // 骨架连接件（全部布置在“无指根法兰”的 z 空档，避免与指根法兰 M5 冲突）
  spliceTop:   { z0: -80, z1: -30, y1: 342, bolts: [[20,-58],[20,-52],[-20,-58],[-20,-52]] }, // 顶部拼接条（6mm，4×M5 自下而上拉紧 A/B）
  wristBlock:  { z0: -140, z1: 58, y0: 342, y1: 374, bolts: [[20,-135],[20,15],[-20,-135],[-20,15]] }, // 腕块（4×M5 旋入掌骨板 + 4×Ø14×6 凸台）
  thumbBridge: { z0: -252, z1: -145, y0: 336, y1: 346, bolts: [[20,-165],[-20,-165]] }, // 拇指桥（2×M5 旋入板A + 4×Ø14×10 凸台锁拇指法兰）
};
HAND.keys = HAND.fingers.map(function(f){return f.key;});

// --- 展开/并拢副（每指 1 台侧挂直线电机，绕掌骨安装处的 x 轴摆动）---
//   枢轴 = 掌骨安装件（指根方块 24×22×20）底面 y = 300 —— 即"接掌那一节"的顶端，
//   因此安装法兰/方块/M4-M5 螺栓组全部不动，只有方块以下（末端段及其余各段）绕 x 摆动。
//   电机吊在枢轴下方、指中面外侧 z = +crankR，推杆沿 y 上行，经 85mm BD 连杆推 R = 26 曲柄。
const SPREAD = {
  pivotY:     289,   // 枢轴 y（= 毂心；毂 R11 顶面 300，让开安装方块底面 303，1.5mm 摆角余量）
  crankR:     26,    // 曲柄半径 / 电机轴线横向偏置（z）
  noseY:     -149,   // 电机前端面（局部 y，枢轴为原点）→ 机身占 [−229,−149]，即指根段外侧、
                     //   落在拼接垫/拼接螺栓（y≈155–195）之下，避让 Ø36 机身：机身 z∈[8,44] 与段体 z≤7 仅 1mm 间隙
  earX:      10.5,   // 叉耳中心 x（±），Ø10 铰链销沿 x
  earT:       4,     // 叉耳厚
  outX:      40,     // 电机/C 吊架/曲柄/D 双耳 的外移量（x）：避开接掌段两侧拼接垫与关节螺栓
  dBossX:     7,     // D 双耳中心 x（±），Ø8 铰链销沿 x
  limitDeg:   12,    // 单指展开/并拢角（机构能力；由曲柄 26 + 连杆 85 与舵机行程决定）
  safeDeg:     5,    // 安全包络（相邻指 70mm 间隙实测值，校验器给出后回填）
};
// --- 运动学（与v4完全一致，零改动） ---
function getDPoint(thetaDeg) {
  const theta = thetaDeg * Math.PI / 180;
  const dx = P.forearmAttachOffset * Math.cos(theta) - (-P.forearmAttachDist) * Math.sin(theta);
  const dy = P.forearmAttachOffset * Math.sin(theta) + (-P.forearmAttachDist) * Math.cos(theta);
  return { x: dx, y: dy };
}

function angleToStroke(thetaDeg) {
  const D = getDPoint(thetaDeg);
  const Ax = P.motorMountX, Ay = P.motorMountY;
  const ex = Ax - D.x;
  const ey = Ay - D.y;
  const val = P.tendonEffLen * P.tendonEffLen - ex * ex;
  if (val < 0) return -1;
  return ey - Math.sqrt(val);
}
P.s_extended = angleToStroke(0);
P.s_contracted = angleToStroke(120);
P.strokeMax = P.s_extended - P.s_contracted;

function strokeToAngle(stroke) {
  const u = Math.max(0, Math.min(P.strokeMax, Number(stroke)));
  if (u === 0) return 0;
  if (u === P.strokeMax) return 120;
  const targetS = P.s_extended - u;
  let lo = 0, hi = 120;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    if (angleToStroke(mid) > targetS) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function getStrokeFromAngle(thetaDeg) {
  return P.s_extended - angleToStroke(thetaDeg);
}

function getForceData(thetaDeg) {
  const t = thetaDeg * Math.PI / 180;
  const D = getDPoint(thetaDeg);
  const ex = P.motorMountX - D.x;
  const h = Math.sqrt(P.tendonLinkLen ** 2 - ex ** 2);
  const xp = -P.forearmAttachOffset * Math.sin(t) + P.forearmAttachDist * Math.cos(t);
  const J = D.x + ex * xp / h;
  const torque = 5 * 9.81 * P.forearmLen * Math.sin(t);
  return { J, forceN: torque / J, torqueNm: torque / 1000 };
}

function transmissionAngle(thetaDeg) {
  const D = getDPoint(thetaDeg);
  const sm = angleToStroke(thetaDeg);
  const Bx = P.motorMountX, By = P.motorMountY - sm;
  const BDx = D.x - Bx, BDy = D.y - By;
  const ODx = D.x, ODy = D.y;
  const dot = BDx * ODx + BDy * ODy;
  const magBD = Math.sqrt(BDx * BDx + BDy * BDy);
  const magOD = Math.sqrt(ODx * ODx + ODy * ODy);
  if (magBD < 0.001 || magOD < 0.001) return 90;
  return Math.acos(Math.min(1, Math.max(-1, Math.abs(dot) / (magBD * magOD)))) * 180 / Math.PI;
}

function fingerDef(key){ for(const f of HAND.fingers) if(f.key===key) return f; return null; }
function clampPose(key, arr){
  const def=fingerDef(key), L=def?def.limits:[0], out=[];
  for(let i=0;i<L.length;i++){
    const v=(arr&&arr[i]!==undefined)?Number(arr[i]):0;
    out.push(Math.max(0, Math.min(L[i], isNaN(v)?0:v)));
  }
  return out;
}
function currentPose(){ const p={}; for(const k of HAND.keys){ const F=FINGERS[k]; if(F) p[k]=F.pose.slice(); } return p; }
// 完整姿态：pose = {指key:[角度...]}；同步全部滑杆
function setPose(pose){
  for(const k of HAND.keys){
    const F=FINGERS[k]; if(!F) continue;
    F.pose = clampPose(k, (pose&&pose[k]!==undefined)?pose[k]:F.pose);
  }
  updateMechanism();
  updateSliderLabels();
}
// 抓握比例 u∈[0,1]：各指按自身安全包络等比联动
function gripPose(u, thumbScale){
  const p={};
  for(const f of HAND.fingers){
    const k=(f.key==='thumb')?(thumbScale===undefined?1:thumbScale):1;
    p[f.key]=f.limits.map(function(l){return l*u*k;});
  }
  return p;
}

function createBox(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function createCylinder(r, h, mat, segs) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segs || 32), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function createSphere(r, mat, segs) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, segs || 16, segs || 16), mat); m.castShadow = true; return m; }
function createZCylinder(r, h, mat, segs) { const m = createCylinder(r, h, mat, segs); m.rotation.x = Math.PI / 2; return m; }
// 六角螺母/柱（对边距af mm，高h mm，轴沿Z；内部统一×s）
function createZHexNut(af, h, mat) {
  const r = af * s / Math.sqrt(3);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h * s, 6), mat);
  m.castShadow = m.receiveShadow = true;
  m.rotation.x = Math.PI / 2;
  return m;
}
// --- 3D打印几何工具（全部按mm建模，再统一乘s缩放到场景） ---
function circlePath(r) { const p = new THREE.Path(); p.absarc(0, 0, r, 0, Math.PI * 2, true); return p; }
// 一体化搭接接头（沿用v4）：凸台直接长在两段臂身上，2×M4竖向贯穿夹紧
function addIntegralSplice(group, prefix, role, yMm, dir, halfWidthMm, halfThickMm, mat) {
  const pr = P.print, ft = pr.spliceFlangeT, pad = pr.splicePadLen;
  const bx = pr.spliceBoltInset, hr = pr.spliceBoltDia / 2, off = pr.spliceBoltOff;
  const by = yMm + dir * off;
  const zIn = halfThickMm + 0.5 * ft;
  const zUp = halfThickMm + 1.5 * ft;
  const mkPad = (nm, yA, yB, zc, punched) => {
    const y0 = Math.min(yA, yB), y1 = Math.max(yA, yB), cy = (y0 + y1) / 2;
    const holes = punched ? [[-bx, by - cy, hr], [bx, by - cy, hr]] : [];
    const p = createPlateWithHoles(2 * halfWidthMm, y1 - y0, ft, holes, mat);
    p.name = nm;
    p.position.set(0, cy * s, zc * s);
    group.add(p);
  };
  if (role === 'lead') {
    mkPad(prefix + 'SplicePadTop',    yMm - dir * pad, yMm + dir * (off + 2), zIn, true);
    mkPad(prefix + 'SplicePadBottom', yMm - dir * pad, yMm + dir * (off + 2), -zIn, true);
    return;
  }
  mkPad(prefix + 'SplicePadTopFoot',    yMm + dir * (off + 2), yMm + dir * pad, zIn, false);
  mkPad(prefix + 'SplicePadBottomFoot', yMm + dir * (off + 2), yMm + dir * pad, -zIn, false);
  mkPad(prefix + 'SplicePadTop',    yMm - dir * 2, yMm + dir * (off + 8), zUp, true);
  mkPad(prefix + 'SplicePadBottom', yMm - dir * 2, yMm + dir * (off + 8), -zUp, true);
  const span = halfThickMm + 2 * ft;
  for (const sx of [-bx, bx]) {
    const tag = sx < 0 ? 'L' : 'R';
    const bolt = createZCylinder(2 * s, (2 * span + 4) * s, MAT.fastener, 20);
    bolt.name = prefix + 'SpliceBolt' + tag;
    bolt.position.set(sx * s, by * s, 0);
    group.add(bolt);
    const head = createZCylinder(3.7 * s, 2.4 * s, MAT.fastener, 6);
    head.name = prefix + 'SpliceBoltHead' + tag;
    head.position.set(sx * s, by * s, (span + 1.2) * s);
    group.add(head);
    const nut = createZHexNut(7, 3, MAT.fastener);
    nut.name = prefix + 'SpliceBoltNut' + tag;
    nut.position.set(sx * s, by * s, -(span + 1.5) * s);
    group.add(nut);
  }
}

function createBoredPlate(shape, boreR, depthMM, mat) {
  if (boreR > 0) shape.holes.push(circlePath(boreR));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 32 });
  geo.translate(0, 0, -depthMM / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function createPlateWithHoles(w, h, depthMM, holes, mat) {
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, -h/2); shape.lineTo(w/2, -h/2); shape.lineTo(w/2, h/2); shape.lineTo(-w/2, h/2); shape.closePath();
  for (const [hx, hy, hr] of holes) { const p = new THREE.Path(); p.absarc(hx, hy, hr, 0, Math.PI*2, true); shape.holes.push(p); }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 24 });
  geo.translate(0, 0, -depthMM/2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function createBoredDisc(outerR, boreR, depthMM, mat) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
  return createBoredPlate(shape, boreR, depthMM, mat);
}
// 带多孔圆盘（电机前法兰：外圆+4×M4螺栓孔）
function createDiscWithHoles(outerR, holes, depthMM, mat) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
  for (const [hx, hy, hr] of holes) { const p = new THREE.Path(); p.absarc(hx, hy, hr, 0, Math.PI*2, true); shape.holes.push(p); }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 40 });
  geo.translate(0, 0, -depthMM / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// 回转体件（肘轴套/连杆端孔）：Lathe旋转成型，孔口自带45°×c导入倒角，孔轴沿Z
function createBushingRing(boreDia, outerDia, depthMM, chamferMM, mat) {
  const r = boreDia / 2, R = outerDia / 2, t = depthMM;
  const c = Math.max(0.2, Math.min(chamferMM, t / 2 - 0.05, (outerDia - boreDia) / 2 - 0.05));
  const pts = [
    new THREE.Vector2(R, 0), new THREE.Vector2(r + c, 0),
    new THREE.Vector2(r, c), new THREE.Vector2(r, t - c),
    new THREE.Vector2(r + c, t), new THREE.Vector2(R, t), new THREE.Vector2(R, 0),
  ];
  const geo = new THREE.LatheGeometry(pts, 32);
  geo.rotateX(Math.PI / 2);
  geo.translate(0, 0, -t / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// ============ 可拆肩螺栓组件（v5核心，替代v4单件肩铆钉） ============
// 塞打螺丝（光杆肩+端部螺纹）+ 平垫 + 尼龙自锁螺母，全部外购标准件，徒手工具即可反复拆装。
// 组件沿+Z装配：头贴−Z侧耳片外端面，光杆穿过耳片-浮动隙-连杆/轴套-浮动隙-耳片，
// 螺纹段伸出足够咬合平垫+自锁螺母。返回Group，子件命名<prefix>BoltHead/Shank/Thread/Washer/Nut。
function createShoulderBolt(prefix, spec, mat) {
  const g = new THREE.Group();
  g.name = prefix + 'BoltAssembly';
  const half = spec.shoulder / 2;
  const head = createZCylinder(spec.head / 2 * s, spec.headT * s, mat, 24);
  head.name = prefix + 'BoltHead';
  head.position.z = -(half + spec.headT / 2) * s;
  g.add(head);
  const shank = createZCylinder(spec.shank / 2 * s, spec.shoulder * s, mat, 32);
  shank.name = prefix + 'BoltShank';
  g.add(shank);
  const threadLen = spec.nutH + 1.6 + 4; // 螺母+平垫+2牙余量
  const thread = createZCylinder(spec.thread / 2 * s, threadLen * s, mat, 24);
  thread.name = prefix + 'BoltThread';
  thread.position.z = (half + threadLen / 2) * s;
  g.add(thread);
  const washer = createZCylinder(spec.washer / 2 * s, 1.6 * s, mat, 24);
  washer.name = prefix + 'BoltWasher';
  washer.position.z = (half + 0.8) * s;
  g.add(washer);
  const nut = createZHexNut(spec.nutAF, spec.nutH, mat);
  nut.name = prefix + 'BoltNut';
  nut.position.z = (half + 1.6 + spec.nutH / 2) * s;
  g.add(nut);
  return g;
}

function buildMechanism() {
  const pr = P.print;
  // —— 参数化构件（同一机构用两次，全部带前缀命名保证唯一） ——
  function buildForkEars(parent, pfx, jy, mat) {
    for (const [tag,z] of [['L',-10.5],['R',10.5]]) {
      const base = createBox(22*s,18*s,pr.earPlateThickness*s,mat);
      base.name = pfx+'EarBase'+tag; base.position.set(0,(jy+17.5)*s,z*s); parent.add(base);
      const web = createBox(18*s,14.5*s,7*s,mat);
      web.name = pfx+'YokeWeb'+tag; web.position.set(0,(jy+19.25)*s,(z>0?9.5:-9.5)*s); parent.add(web);
      const boss = createBoredDisc(pr.earBossRadius,P.boreElbow/2,pr.earPlateThickness,mat);
      boss.name = pfx+'Fork'+tag; boss.position.set(0,jy*s,z*s); parent.add(boss);
      const rib = createBox(9*s,8*s,pr.earPlateThickness*s,mat);
      rib.name = pfx+'Fork'+tag+'Rib'; rib.position.set(0,(jy+12)*s,z*s); parent.add(rib);
    }
  }
  // 掌骨安装法兰（独立打印件，装在P1掌端上方面板）：56×56圆角方板 + Ø22h7定位止口（插入手掌球窝）
  // 4×M5沉头孔对角44×44 + Ø9中心穿线孔；rotX90打印（板面落床、止口朝上，免支撑）
  function buildPalmMount(parent, pfx) {
    const py = P.upperArmLen + 20;   // = 320：指根方块顶面 = 板底面（零间隙贴合）
    const t  = pr.basePlateT;        // 板厚 6
    const g = new THREE.Group(); g.name = pfx + 'Mount';
    const c = pr.basePlateC, rc = pr.basePlateRC;   // 56×56 R8 圆角方板
    const shp = new THREE.Shape();   // 圆角方板（XY为世界XZ，挤出沿local Z=世界−Y）
    shp.moveTo(-c + rc, -c); shp.lineTo(c - rc, -c); shp.absarc(c - rc, -c + rc, rc, -Math.PI / 2, 0, false);
    shp.lineTo(c, c - rc); shp.absarc(c - rc, c - rc, rc, 0, Math.PI / 2, false);
    shp.lineTo(-c + rc, c); shp.absarc(-c + rc, c - rc, rc, Math.PI / 2, Math.PI, false);
    shp.lineTo(-c, -c + rc); shp.absarc(-c + rc, -c + rc, rc, Math.PI, Math.PI * 1.5, false);
    shp.closePath();
    const axisHole = new THREE.Path(); axisHole.absarc(0, 0, 4.5, 0, Math.PI * 2, true);
    shp.holes.push(axisHole);                         // Ø9 中心走线孔
    for (const [hx, hz] of pr.rootBoltXZ) {           // 内圈 4×Ø4.4：穿板旋入指根方块螺孔（真正把法兰连到 P1）
      const h = new THREE.Path(); h.absarc(hx, hz, pr.basePlateHoleDia / 2, 0, Math.PI * 2, true);
      shp.holes.push(h);
    }
    for (const [hx, hz] of [[22,22],[22,-22],[-22,22],[-22,-22]]) {   // 外圈 4×Ø5.5：与手掌球窝对接
      const h = new THREE.Path(); h.absarc(hx, hz, pr.basePlatePalmHoleR, 0, Math.PI * 2, true);
      shp.holes.push(h);
    }
    const bg = new THREE.ExtrudeGeometry(shp, { depth: t, bevelEnabled: false, steps: 1, curveSegments: 24 });
    bg.scale(s, s, s);
    const base = new THREE.Mesh(bg, MAT.base);
    base.name = pfx + 'FlangeBase'; base.castShadow = base.receiveShadow = true;
    base.rotation.x = Math.PI / 2; base.position.y = (py + t) * s;   // 挤出沿 −Y：板占 y[py, py+t]=[320,326]，底面坐方块顶面
    g.add(base);
    // 4×M4×16 内六角：头在 y[326,330]，杆 y[310,326]（穿板6 + 旋入方块10）
    const bl = pr.basePlateBolt;
    pr.rootBoltXZ.forEach(([bx, bz], i) => {
      const bolt = createCylinder(bl.shank / 2 * s, bl.len * s, MAT.fastener, 16);   // 轴沿Y（竖直穿板入方块）
      bolt.name = pfx + 'MountBolt' + (i + 1);
      bolt.position.set(bx * s, (py + t - bl.len / 2) * s, bz * s);
      g.add(bolt);
      const head = createCylinder(bl.head / 2 * s, bl.headT * s, MAT.fastener, 20);
      head.name = pfx + 'MountBoltHead' + (i + 1);
      head.position.set(bx * s, (py + t + bl.headT / 2) * s, bz * s);
      g.add(head);
    });
    parent.add(g);
  }
  function buildFlangePlate(parent, pfx, fpY0) {
    const fpT = pr.flangePlateT;

    const neck = createPlateWithHoles(18,14,fpT,[],MAT.base);
    neck.name = pfx+'FlangePlateNeck'; neck.rotation.x = Math.PI/2;
    neck.position.set(1*s,plateMidY*s,0); parent.add(neck);
    const holes = [[P.motorMountX,0,P.motorBodyRadius+pr.radialClearance+0.2]];
    for (const [bx,bz] of pr.flangeBoltXZ) holes.push([bx,bz,2.2]);
    const shp = new THREE.Shape();
    shp.moveTo(9,-18.5); shp.lineTo(47,-18.5); shp.lineTo(47,18.5); shp.lineTo(9,18.5); shp.closePath();
    for (const [hx,hy,hr] of holes) { const p=new THREE.Path(); p.absarc(hx,hy,hr,0,Math.PI*2,true); shp.holes.push(p); }
    const g = new THREE.ExtrudeGeometry(shp,{depth:fpT,bevelEnabled:false,steps:1,curveSegments:32});
    g.translate(0,0,-fpT/2); g.scale(s,s,s);
    const plate = new THREE.Mesh(g,MAT.base);
    plate.name = pfx+'FlangePlate'; plate.castShadow = plate.receiveShadow = true;
    plate.rotation.x = Math.PI/2; plate.position.set(0,plateMidY*s,0);
    parent.add(plate);
  }
  function buildMotorSet(motorGroup, pfx, frontY, rearY, collarTop, boltYs) {
    const body = createCylinder(P.motorBodyRadius*s,P.motorBodyLen*s,MAT.motorBody,48);
    body.name = pfx+'MotorBody'; body.position.set(P.motorMountX*s,(frontY+rearY)/2*s,0); motorGroup.add(body);
    const rearCap = createCylinder(P.motorBodyRadius*s,4*s,MAT.base,48);
    rearCap.name = pfx+'MotorRearCap'; rearCap.position.set(P.motorMountX*s,(rearY-2)*s,0); motorGroup.add(rearCap);
    const frontCap = createCylinder(P.motorBodyRadius*s,4*s,MAT.base,48);
    frontCap.name = pfx+'MotorFrontCap'; frontCap.position.set(P.motorMountX*s,(frontY+2)*s,0); motorGroup.add(frontCap);
    // v7 修正：原实现是 Ø38 圆盘却把 4×M4 孔放在 r=20.6（落在盘外）→ earcut 自交碎片、M4 头压在盘外，
    //   现改为方形法兰板 38×37（与安装板宽板同足迹），4×Ø4.4 完整落在板内 + 中心 Ø10 推杆通孔
    const flangeHoles = pr.flangeBoltXZ.map(([bx,bz])=>[bx-P.motorMountX,bz,pr.spliceBoltDia/2]);
    flangeHoles.push([0,0,5]);
    const flange = createPlateWithHoles(38,37,4,flangeHoles,MAT.base);
    flange.name = pfx+'MotorFlange'; flange.rotation.x = Math.PI/2;
    flange.position.set(P.motorMountX*s,(frontY+2)*s,0); motorGroup.add(flange);  // 法兰占[frontY,frontY+4]，顶面=安装板底面
    pr.flangeBoltXZ.forEach(([bx,bz],i)=>{
      const bolt = createCylinder(pr.collarBolt.shank/2*s,12*s,MAT.fastener,20);
      bolt.name = pfx+'FlangeBolt'+(i+1); bolt.position.set(bx*s,(frontY+6)*s,bz*s); motorGroup.add(bolt);
      const head = createCylinder(3.5*s,4*s,MAT.fastener,24);
      head.name = pfx+'FlangeBolt'+(i+1)+'Head'; head.position.set(bx*s,(frontY-2)*s,bz*s); motorGroup.add(head);
    });
    const Rin = P.motorBodyRadius+pr.ringClearance, Rout = Rin+pr.collarWall;
    const gapRad = pr.collarGapDeg*Math.PI/180, a0 = Math.PI-gapRad/2;
    const rs = new THREE.Shape();
    rs.absarc(0,0,Rout,a0,a0+Math.PI*2-gapRad,false);
    rs.absarc(0,0,Rin,a0+Math.PI*2-gapRad,a0,true);
    rs.closePath();
    const rg = new THREE.ExtrudeGeometry(rs,{depth:pr.collarY1-pr.collarY0,bevelEnabled:false,steps:1,curveSegments:48});
    rg.scale(s,s,s);
    const ring = new THREE.Mesh(rg,MAT.clamp);
    ring.name = pfx+'CollarRing'; ring.castShadow=ring.receiveShadow=true;
    ring.rotation.x = Math.PI/2; ring.position.set(P.motorMountX*s,collarTop*s,0);
    motorGroup.add(ring);
    const zA=7,zB=11;
    const uA=-Math.sqrt(Rin*Rin-zA*zA), uB=-Math.sqrt(Rin*Rin-zB*zB);
    const ts = new THREE.Shape();
    ts.moveTo(-30,zA); ts.lineTo(uA,zA);
    ts.absarc(0,0,Rin,Math.atan2(zA,uA),Math.atan2(zB,uB),true);
    ts.lineTo(-30,zB); ts.closePath();
    const hp = new THREE.Path(); hp.absarc(-26,9,pr.collarBolt.shank/2+0.2,0,Math.PI*2,true); ts.holes.push(hp);
    boltYs.forEach((y,i)=>{
      const tag=['A','B'][i];
      // 双侧耳板：z=+7..11（原名保留）与 z=-7..-11（新增镜像件）。2×耳板4 + 臂身14 = 22 = M4×22 光杆
      for (const side of [1,-1]) {
        const tg = new THREE.ExtrudeGeometry(ts,{depth:12,bevelEnabled:false,steps:1,curveSegments:32});
        tg.scale(s,s,s);
        const tab = new THREE.Mesh(tg,MAT.clamp);
        tab.name = pfx+'CollarTab'+tag+(side>0?'':'N'); tab.castShadow=tab.receiveShadow=true;
        tab.rotation.x = side>0? Math.PI/2 : -Math.PI/2;
        tab.position.set(P.motorMountX*s,(y+side*6)*s,0);
        motorGroup.add(tab);
      }
      const bolt = createZCylinder(pr.collarBolt.shank/2*s,22*s,MAT.fastener,20);
      bolt.name = pfx+'CollarBoltShank'+tag; bolt.position.set(2*s,y*s,0); motorGroup.add(bolt);
      const head = createZCylinder(pr.collarBolt.head/2*s,pr.collarBolt.headT*s,MAT.fastener,24);
      head.name = pfx+'CollarBoltHead'+tag; head.position.set(2*s,y*s,(11+pr.collarBolt.headT/2)*s); motorGroup.add(head);
      const washer = createZCylinder(pr.collarBolt.washer/2*s,1.6*s,MAT.fastener,20);
      washer.name = pfx+'CollarBoltWasher'+tag; washer.position.set(2*s,y*s,-(11+0.8)*s); motorGroup.add(washer);
      const nut = createZHexNut(pr.collarBolt.nutAF,pr.collarBolt.nutH,MAT.fastener);
      nut.name = pfx+'CollarBoltNut'+tag; nut.position.set(2*s,y*s,-(11+1.6+pr.collarBolt.nutH/2)*s); motorGroup.add(nut);
    });
    // 推杆（Ø8光杆+M6螺纹段）与B叉头（沉龛螺母夹持）
    const rodGroup = new THREE.Group(); rodGroup.name = pfx+'Rod';
    const rod = createCylinder(4*s,100*s,MAT.motorRod,32); rod.name = pfx+'ExposedRod'; rodGroup.add(rod);
    const rt = createCylinder(3.1*s,pr.rodThreadLen*s,MAT.motorRod,24); rt.name = pfx+'RodThreadStub'; rodGroup.add(rt);
    const bC = new THREE.Group(); bC.name = pfx+'BClevis';
    // 沉龛：内档 X±5.4 / Z±6.2（M6螺母对角11.55、对边10 → 留0.4/0.43间隙）
    // 螺母坐在底板顶面 [by0+2,by0+7]；围壁加高到 by0+7.5 完整包住螺母的六角面 → 防转
    // （推杆受拉时靠“螺母防转+推杆不自转”把拉力传给叉头；受压时螺母底面直接压底板）
    const pocketX=5.4,pocketZ=6.2,by0=pr.bridgeY0,by1=pr.bridgeY1;
    const mmBox=(w,h,d)=>createBox(w*s,h*s,d*s,MAT.clamp);
    const addB=(m,nm,x,y,z)=>{m.name=nm;m.position.set(x*s,y*s,z*s);bC.add(m);};
    addB(mmBox(18,2,18),pfx+'BridgeFloor',0,by0+1,0);                              // 螺母承推底板（底板顶面=by0+2）
    addB(mmBox(18,6,9-pocketZ),pfx+'BridgeWallZP',0,by0+4.5,(pocketZ+9)/2);
    addB(mmBox(18,6,9-pocketZ),pfx+'BridgeWallZN',0,by0+4.5,-(pocketZ+9)/2);
    addB(mmBox(9-pocketX,6,2*pocketZ),pfx+'BridgeWallXP',(pocketX+9)/2,by0+4.5,0);
    addB(mmBox(9-pocketX,6,2*pocketZ),pfx+'BridgeWallXN',-(pocketX+9)/2,by0+4.5,0);
    addB(mmBox(2,2,2*pocketZ),pfx+'BridgeRibL',-3.5,by0+1,0);                      // 底板加劲肋（与底板同厚，不侵入龛内）
    addB(mmBox(2,2,2*pocketZ),pfx+'BridgeRibR',3.5,by0+1,0);
    for (const [tag,z] of [['L',pr.clevisPlateZ],['R',-pr.clevisPlateZ]]) {
      const arm = createPlateWithHoles(16,11.5,4,[],MAT.clamp);
      arm.name = pfx+'ClevisArm'+tag; arm.position.set(0,10.25*s,z*s); bC.add(arm);
      const plate = createBoredDisc(8,P.boreLink/2,4,MAT.clamp);
      plate.name = pfx+'ClevisPlate'+tag; plate.position.z = z*s; bC.add(plate);
    }
    const bNut = createCylinder(pr.nutPocketAF/Math.sqrt(3)*s,5*s,MAT.fastener,6);
    bNut.name = pfx+'RodNut'; bNut.position.set(0,(by0+4.5)*s,0); bC.add(bNut);   // 坐在底板顶面 by0+2，占[by0+2,by0+7]
    bC.add(createShoulderBolt(pfx+'b',pr.boltB,MAT.fastener));
    rodGroup.add(bC);
    motorGroup.add(rodGroup);
  }
  function buildDrivenJoint(parent, pfx) {
    // 被驱动端接口：肘轴套+毂（绕前一级叉耳转动）+ D侧板叉耳（承接BD连杆）+ Ø8×20销
    const sleeve = createBushingRing(P.boreElbow,pr.sleeveOuterDia,pr.sleeveThickness,pr.chamfer,MAT.bearingDS);
    sleeve.name = pfx+'SleeveBody'; parent.add(sleeve);
    const hub = createBoredDisc(9.5,P.boreElbow/2,12,MAT.forearm);
    hub.name = pfx+'SleeveHub'; parent.add(hub);
    for (const [tag,zc] of [['L',8],['R',-8]]) {
      const arm = createPlateWithHoles(18,10,4,[[P.forearmAttachOffset-9,0,P.boreLink/2]],MAT.base);
      arm.name = pfx+'DClevisArm'+tag; arm.position.set(9*s,-P.forearmAttachDist*s,zc*s); parent.add(arm);
      const boss = createBoredDisc(pr.dBossOD/2,P.boreLink/2,pr.dBossT,MAT.base);
      boss.name = pfx+'DClevisBoss'+tag;
      boss.position.set(P.forearmAttachOffset*s,-P.forearmAttachDist*s,(zc>0?5.5:-5.5)*s);
      parent.add(boss);
    }
    const dBolt = createShoulderBolt(pfx+'d',pr.boltD,MAT.fastener);
    dBolt.position.set(P.forearmAttachOffset*s,-P.forearmAttachDist*s,0);
    parent.add(dBolt);
  }
  function waistShape(pfx, yEnd, halfEnd) {
    // 收窄腰身：0..-46 ±5.5（顶部R5.4缺口让Ø10销轴），-46..yEnd 接 halfEnd
    const sh = new THREE.Shape();
    const pts=[[-5.5,0],[-5.4,0],'ARC',[5.4,0],[5.5,0],[5.5,-46]];
    if (halfEnd !== 5.5) pts.push([halfEnd,-46]);
    pts.push([halfEnd,yEnd],[-halfEnd,yEnd]);
    if (halfEnd !== 5.5) pts.push([-halfEnd,-46]);
    pts.push([-5.5,-46]);
    pts.forEach((p,i)=>{
      if(p==='ARC'){sh.absarc(0,0,5.4*s,Math.PI,Math.PI*2,false);return;}
      if(i===0)sh.moveTo(p[0]*s,p[1]*s);else sh.lineTo(p[0]*s,p[1]*s);
    });
    sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh,{depth:12*s,bevelEnabled:false,steps:1,curveSegments:32});
    g.translate(0,0,-6*s);
    const m = new THREE.Mesh(g,MAT.forearm);
    m.name = pfx; m.castShadow=m.receiveShadow=true;
    return m;
  }
  function rectSegment(name,yA,yB,half,mat,holes) {
    const sh = new THREE.Shape();
    [[-half,yA],[half,yA],[half,yB],[-half,yB]].forEach(([x,y],i)=>{ if(i===0)sh.moveTo(x*s,y*s);else sh.lineTo(x*s,y*s); });
    sh.closePath();
    for (const [hx,hy,hr] of (holes||[])) { const p=new THREE.Path(); p.absarc(hx*s,hy*s,hr*s,0,Math.PI*2,true); sh.holes.push(p); }
    const g = new THREE.ExtrudeGeometry(sh,{depth:12*s,bevelEnabled:false,steps:1});
    g.translate(0,0,-6*s);
    const m = new THREE.Mesh(g,mat);
    m.name = name; m.castShadow=m.receiveShadow=true;
    return m;
  }
  function buildTendon(parent, pfx) {
    const g = new THREE.Group(); g.name = pfx+'Tendon';
    const webHalf = P.tendonLinkLen/2 - P.boreLink/2;
    // 腹板带3×Ø6减重通孔（孔轴沿Z、避开端环孔壁：孔边距端孔壁4.9mm、距杆侧壁4.5mm）
    const web = createPlateWithHoles(pr.linkWidth, 2*webHalf, pr.linkThickness,
      [[0,26,3],[0,0,3],[0,-26,3]], MAT.tendon);
    web.name = pfx+'TendonWeb'; g.add(web);
    for (const [j,ly] of [['B',P.tendonLinkLen/2],['D',-P.tendonLinkLen/2]]) {
      const eye = createBushingRing(P.boreLink,pr.linkWidth,pr.linkThickness,pr.chamfer,MAT.bushingDS);
      eye.name = pfx+'TendonEye'+j; eye.position.y = ly*s; g.add(eye);
    }
    parent.add(g);
    return g;
  }

  // ============ 通用：被驱动指节段（三个关节单元同构） ============
  // 近端 = 袖套+毂+D侧板叉耳（绕上一级叉耳转动）；远端 = 叉耳 + 电机安装板 + 电机 + BD连杆。
  // P1/P2 因此逐件相同（同长同构、可互换），只有命名前缀与所处链条位置不同。
  function buildDrivenPhalanx(parent, pfx, segLen, mPfx, tPfx) {
    const sy = -170;                       // 拼接缝：让开本段电机抱箍(y=-125..-83)与耳片(-282..)
    parent.add(waistShape(pfx+'BodyWaist',-46,5.5));
    {
      const sh2 = new THREE.Shape();
      [[-7,-46],[7,-46],[7,sy],[-7,sy]].forEach(([x,y],i)=>{ if(i===0)sh2.moveTo(x*s,y*s);else sh2.lineTo(x*s,y*s); });
      sh2.closePath();
      for (const y of [-116,-91]) { const p=new THREE.Path(); p.absarc(2*s,y*s,2.2*s,0,Math.PI*2,true); sh2.holes.push(p); }
      const g2 = new THREE.ExtrudeGeometry(sh2,{depth:12*s,bevelEnabled:false,steps:1});
      g2.translate(0,0,-6*s);
      const mh = new THREE.Mesh(g2,MAT.forearm);
      mh.name=pfx+'BodyHeel'; mh.castShadow=mh.receiveShadow=true;
      parent.add(mh);
    }
    // v7 让位：远端躯体止于 -segLen+13，避开下一级 Ø20 袖套/毂（否则整块躯体插入轴套 ~127mm²）
    parent.add(rectSegment(pfx+'BodyDistal',sy,-segLen+13,7,MAT.forearm,
      [[pr.spliceBoltInset, sy-pr.spliceBoltOff, pr.spliceBoltDia/2],[-pr.spliceBoltInset, sy-pr.spliceBoltOff, pr.spliceBoltDia/2]]));
    addIntegralSplice(parent,pfx+'P','lead',sy,-1,7,6,MAT.forearm);
    addIntegralSplice(parent,pfx+'D','lag',sy,-1,7,6,MAT.forearm);
    buildDrivenJoint(parent,pfx);                              // 近端关节接口（局部 0,-31）
    buildForkEars(parent,pfx,-segLen,MAT.base);                // 远端叉耳（下一关节）
    const oBolt = createShoulderBolt(pfx.replace(/_p/, '_o'),pr.boltElbow,MAT.fastener);  // 本段远端关节肩螺栓（O1/O2）
    oBolt.position.y = -segLen*s;                                                // 肩螺栓轴线须落在远端关节轴上
    parent.add(oBolt);
    buildFlangePlate(parent,pfx,-segLen+pr.flangePlateY0);     // 本段所载电机的安装板
    const mg = new THREE.Group(); mg.name = mPfx + 'Motor';
    parent.add(mg);                                           // 电机随本段运动
    buildMotorSet(mg,mPfx,-segLen+P.motorFrontY,-segLen+P.motorMountY+P.motorRearOverhang,
                  -segLen+pr.collarY1,[-segLen+pr.collarBoltY[0],-segLen+pr.collarBoltY[1]]);
    const tg = buildTendon(parent,tPfx);
    return {motor:mg,tendon:tg};
  }
  // ============ 反根后的自由端配件：指尖圆头 + 防滑抓握垫（现装于掌段远端 = 原指根端） ============
  //   正向模型里这组配件在末端段 Pn 的末端；反根后自由端变成掌段远端，整组随之搬家：
  //   组内绕 Z 转 180° 再平移 TY = 掌段长 − 末端长 = 50mm，使圆头/防滑垫落在掌段外侧 +7/+14mm。
  //   经反根镜像（chainRoot）后，它们与正向模型的指尖逐点同位 —— 装配位外形不变，只是归属段对调。
  function buildTipFittings(parent, pfx) {
    const TY = P.upperArmLen - P.forearmLen;                 // = 50mm
    const asm = new THREE.Group(); asm.name = pfx + 'TipAsm';
    parent.add(asm); asm.rotation.z = Math.PI; asm.position.set(0, TY * s, 0);
    const tip = createCylinder(12*s,14*s,MAT.base,32);
    tip.name=pfx+'FingerTip'; tip.position.set(0,(-P.forearmLen-7)*s,0);
    asm.add(tip);
    const pad = createSphere(12*s,MAT.base,24);
    pad.name=pfx+'FingerTipPad'; pad.position.set(0,(-P.forearmLen-14)*s,0);
    asm.add(pad);
    const pc = createBox(22*s, 18*s, 4*s, MAT.base);
    pc.name = pfx+'GripPad'; pc.position.set(0, -262*s, -12*s);
    asm.add(pc);
    for (let k = 0; k < 3; k++) {
      const rib = createBox(22*s, 3*s, 1.6*s, MAT.base);
      rib.name = pfx+'GripRib' + (k + 1);
      rib.position.set(0, (-257 + k * 5) * s, -14.8 * s);
      asm.add(rib);
    }
  }

  // ============ 末端段 Pn（反根后它是“接掌固定段”）：段体/拼接/近端被动接口同正向 ============
  //   区别只有一处：原掌段上的“指根方块 + 掌骨安装法兰(56×56) + 4×M4”整组搬到这里，
  //   组内绕 Z 转 180° 再平移 TY = 50mm → 法兰面落在本段远端外 26mm（与正向掌段的安装面同位）。
  function buildTerminalPhalanx(parent, pfx, palmPfx) {
    const sy3 = -125;
    parent.add(waistShape(pfx+'BodyWaist',-46,5.5));
    parent.add(rectSegment(pfx+'BodyHeel',-46,sy3,7,MAT.forearm));
    parent.add(rectSegment(pfx+'BodyDistal',sy3,-P.forearmLen,7,MAT.forearm,
      [[pr.spliceBoltInset, sy3-pr.spliceBoltOff, pr.spliceBoltDia/2],[-pr.spliceBoltInset, sy3-pr.spliceBoltOff, pr.spliceBoltDia/2]]));
    addIntegralSplice(parent,pfx+'P','lead',sy3,-1,7,6,MAT.forearm);
    addIntegralSplice(parent,pfx+'D','lag',sy3,-1,7,6,MAT.forearm);
    buildDrivenJoint(parent,pfx);
    // —— 掌部安装件（原掌段指根方块 + 掌骨法兰 + 4×M4）：名字沿用掌段前缀（校验/装配图按名索引）——
    const TY = P.upperArmLen - P.forearmLen;                 // = 50mm
    const asm = new THREE.Group(); asm.name = palmPfx + 'MountAsm';
    parent.add(asm); asm.rotation.z = Math.PI; asm.position.set(0, TY * s, 0);
    // 方块厚度 20→17：底面抬到 y=303，让开铰链毂顶面(300)与指根段顶角摆动(≈301.5)
    const palmBlock = createPlateWithHoles(24, 22, 17, pr.rootBoltXZ.map(function(h){return [h[0],h[1],1.7];}), MAT.base);
    palmBlock.name = palmPfx+'Base'; palmBlock.rotation.x = Math.PI/2;
    palmBlock.position.y = (P.upperArmLen+11.5)*s;
    asm.add(palmBlock);
    buildPalmMount(asm, palmPfx);
  }

  // ============ 展开/并拢副（每指 1 台侧挂直线电机）：绕掌骨安装处的 x 轴摆动 ============
  //   枢轴 = 掌骨安装件底面（局部 y = SPREAD.pivotY = 300），铰链销 Ø10 沿 x。
  //   固定侧（随安装件/掌骨板）: 叉耳 2 片 + Ø10 销 + 吊架 + 电机安装板 + Ø36 直线电机 + 后抱箍
  //   转动侧（随指根）        : 毂（Ø10 孔）+ 曲柄臂 R + D 双耳（Ø8 销）
  //   传动：电机推杆沿 y 上行（前端面 y = SPREAD.noseY），经 85mm BD 连杆推曲柄 → 指根绕 x 转 φ
  //   闭合关系（在 (y,z) 平面内，曲柄零位沿 +z）：D(φ) = (−R sinφ, R cosφ)
  //            B = D − (0, √(L² − (R − R cosφ)²))  ⇒ |BD| ≡ L = 85（恒等闭合，无需迭代求解）
  //   φ = ±12° 时推杆只用 ±5.4mm 行程（电机 59mm 全行程的 9%），故侧挂小电机也可直接替换。
  function buildSpreadUnit(rootParent, movingParent, K) {
    const SP = SPREAD;
    const R = SP.crankR, NE = SP.noseY;
    // ---------- 固定侧 ----------
    const fx = new THREE.Group(); fx.name = K + '_spreadFixed';
    fx.position.set(0, SP.pivotY * s, 0); rootParent.add(fx);
    for (const [tag, xx] of [['L', SP.earX], ['R', -SP.earX]]) {
      const ear = createBox(SP.earT*s, 30*s, 22*s, MAT.base);
      ear.name = K + '_spFork' + tag; ear.position.set(xx*s, 1*s, 0); fx.add(ear);
      const boss = createBoredDisc(pr.earBossRadius, P.boreElbow/2, SP.earT, MAT.base);
      boss.name = K + '_spForkBoss' + tag;
      boss.rotation.y = Math.PI/2; boss.position.set(xx*s, 0, 0); fx.add(boss);
    }
    const oBolt = createShoulderBolt(K + '_sp_o', pr.boltElbow, MAT.fastener);
    oBolt.rotation.y = Math.PI/2; fx.add(oBolt);                       // Ø10 铰链销：轴线沿 x（销体原生沿 z）
    // 吊架：电机安装板顶面(y=−77) → 掌骨法兰底面(y=+31)，落在 x∈[10,18]、z∈[16,28]，
    //   与曲柄(≤x9)、BD连杆(≤x4)、D双耳(≤x9) 在 x 上分离 → 摆动全程无干涉
    //   L 形：立柱 x∈[outX−6,outX+6]、z∈[16,28]（贴着电机安装板外侧），横臂到指根方块 (y=+31)
    const brk = createBox(12*s, 180*s, 12*s, MAT.base);
    brk.name = K + '_spBracket'; brk.position.set(SP.outX*s, -59*s, 22*s); fx.add(brk);
    const foot = createBox((SP.outX - 4)*s, 17*s, 12*s, MAT.base);
    foot.name = K + '_spBracketFoot'; foot.position.set((SP.outX/2 + 2)*s, 22.5*s, 22*s); fx.add(foot);
    const footPad = createBox(16*s, 17*s, 22*s, MAT.base);
    footPad.name = K + '_spBracketPad'; footPad.position.set(4*s, 22.5*s, 11*s); fx.add(footPad);
    // 电机：轴沿 y，轴线落在 (x=0, z=+R)；buildMotorSet 内部 +28mm 偏置用 mg 平移补回
    const mg = new THREE.Group(); mg.name = K + '_spMotorGroup';
    mg.position.set((SP.outX - P.motorMountX)*s, 0, R*s); fx.add(mg);   // 轴线落在 (x=outX, z=+R)
    buildMotorSet(mg, K + '_sp', NE, NE - 80, NE - 38, [NE - 72, NE - 48]);
    buildFlangePlate(mg, K + '_sp', NE + 4);
    // 推杆 / 推杆叉头 / 桥座 / M6 螺母：由 buildMotorSet 一并生成（<前缀>ExposedRod / BClevis），
    //   交 updateRodUnit 逐帧摆位 —— 此处不再重复建件，避免同名件双份。
    // ---------- 转动侧（随指根绕 x 摆）----------
    const hub = createBoredDisc(11, P.boreElbow/2, 13, MAT.forearm);
    hub.name = K + '_spHub'; hub.rotation.y = Math.PI/2; movingParent.add(hub);
    // 曲柄：毂 → 横向 (x=outX) → 外伸 R，末端 D 双耳（Ø8 销沿 x）
    const arm = createBox(SP.outX*s, 12*s, (R - 4)*s, MAT.forearm);
    arm.name = K + '_spCrankArm'; arm.position.set((SP.outX/2)*s, 0, (R + 4)/2*s); movingParent.add(arm);
    for (const [tag, xx] of [['L', SP.outX + SP.dBossX], ['R', SP.outX - SP.dBossX]]) {
      const boss = createBoredDisc(pr.dBossOD/2, P.boreLink/2, pr.dBossT, MAT.base);
      boss.name = K + '_spDClevisBoss' + tag;
      boss.rotation.y = Math.PI/2; boss.position.set(xx*s, 0, R*s); movingParent.add(boss);
    }
    const dBolt = createShoulderBolt(K + '_sp_d', pr.boltD, MAT.fastener);
    dBolt.rotation.y = Math.PI/2; dBolt.position.set(SP.outX*s, 0, R*s); movingParent.add(dBolt);
    // ---------- BD 连杆（85mm 同型件）：挂在平面转换组里，逐帧按 B/D 摆位 ----------
    const plan = new THREE.Group(); plan.name = K + '_spLinkPlane';
    plan.rotation.y = -Math.PI/2; plan.position.x = SP.outX*s; fx.add(plan);   // plan(x,y) ≡ 实际(z,y)，整体在 x=outX
    const link = buildTendon(plan, K + '_spt');
    return { fixed: fx, motor: mg, link: link, linkPlane: plan };
  }

  // ============ 单指（反根链）：掌段(自由末端·载电机0·带指尖配件) + n 个关节单元 ============
  //   段分组依旧是 groups[0]=掌段 … groups[n]=末端段；但反根后：
  //     · groups[n]（末端段）固定于 chainRoot —— 它就是接掌的根段，掌部安装件挂在它远端；
  //     · groups[n−1] … groups[0] 依次套一层关节组 joints[j]，绕各自远端关节 Oj 转 −θj；
  //     · 电机 k 与连杆 k 都挂在自己所在段上（反根后“电机 k 驱动段 k 自身”），与正向逐件同构。
  //   整链再套一层 chainRoot（绕 Z 转 180° + 平移 2M，M = 反根镜像面）把链条倒到掌面另一侧：
  //   于是接掌端仍是原位置的原安装面，自由端（原指根端）成为指尖。
  function buildFinger(f) {
    const K = f.key, N = f.n;
    const root = new THREE.Group(); root.name = K+'_root';
    root.position.set(f.pos[0]*s, f.pos[1]*s, f.pos[2]*s);
    root.quaternion.copy(new THREE.Quaternion()
      .setFromAxisAngle(new THREE.Vector3(0,0,1), f.fan*Math.PI/180)
      .multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), f.spin*Math.PI/180)));
    scene.add(root);
    const F = { key:K, label:f.label, n:N, limits:f.limits.slice(), root:root, fan:f.fan, spin:f.spin,
                pos:f.pos.slice(), groups:[], joints:[], motors:[], tendons:[], pose:new Array(N).fill(0) };
    FINGERS[K] = F;
    // —— 反根镜像层：把“正向坐标（掌段在上）的整链”映到“接掌端在上”的装配位 ——
    const M = (P.upperArmLen - P.phalanx1Len*(N-1) - P.forearmLen) / 2;
    const chainRoot = new THREE.Group(); chainRoot.name = K+'_chainRoot';
    chainRoot.rotation.z = Math.PI; chainRoot.position.set(0, 2*M*s, 0);
    // —— 展开/并拢层：指根绕 x 摆 φ（枢轴 = 安装件底面）；反根镜像层挂在其下 ——
    const spread = new THREE.Group(); spread.name = K+'_spread';
    spread.position.set(0, SPREAD.pivotY*s, 0);   // 289：毂心

    root.add(spread); F.spreadGroup = spread;
    F.spread = 0; F.spreadLimit = SPREAD.limitDeg;
    chainRoot.position.set(0, (2*M - SPREAD.pivotY)*s, 0);
    spread.add(chainRoot); F.chainRoot = chainRoot;

    // —— 掌段（反根后 = 自由末端，载电机0 + 指尖配件）——
    const q = K+'_palm';
    const palmGroup = new THREE.Group(); palmGroup.name = q;
    chainRoot.add(palmGroup); F.groups.push(palmGroup);
    const syU = pr.spliceYUpper;
    const segsP = [
      { name:q+'BodyDistal', pts:[[-3,13],[3,13],[8,22],[8,syU],[-8,syU],[-8,22]], holes:[] },
      { name:q+'BodyProximal', pts:[[-8,syU],[8,syU],[8,P.upperArmLen],[-8,P.upperArmLen]],
        holes: pr.collarBoltY.map(function(y){ return [2, y, pr.collarBolt.shank/2 + 0.2]; })
               .concat([[pr.spliceBoltInset, syU+pr.spliceBoltOff, pr.spliceBoltDia/2],
                        [-pr.spliceBoltInset, syU+pr.spliceBoltOff, pr.spliceBoltDia/2]]) },
    ];
    for (const seg of segsP) {
      const sh = new THREE.Shape();
      seg.pts.forEach(function(p,i){ if(i===0) sh.moveTo(p[0]*s,p[1]*s); else sh.lineTo(p[0]*s,p[1]*s); });
      sh.closePath();
      for (const h of seg.holes) { const pth=new THREE.Path(); pth.absarc(h[0]*s,h[1]*s,h[2]*s,0,Math.PI*2,true); sh.holes.push(pth); }
      const gg = new THREE.ExtrudeGeometry(sh,{depth:14*s,bevelEnabled:false,steps:1});
      gg.translate(0,0,-7*s);
      const mm = new THREE.Mesh(gg,MAT.upperArm);
      mm.name = seg.name; mm.castShadow=mm.receiveShadow=true;
      palmGroup.add(mm);
    }
    addIntegralSplice(palmGroup,q+'D','lead',syU,1,8,7,MAT.upperArm);
    addIntegralSplice(palmGroup,q+'P','lag',syU,1,8,7,MAT.upperArm);
    buildTipFittings(palmGroup,q);          // 指尖圆头/防滑垫落在掌段远端（原指根端）
    buildFlangePlate(palmGroup,q,pr.flangePlateY0);
    buildForkEars(palmGroup,q,0,MAT.base);
    palmGroup.add(createShoulderBolt(K+'_o0',pr.boltElbow,MAT.fastener));
    const m0 = new THREE.Group(); m0.name = K+'_m0Motor'; palmGroup.add(m0);   // 电机0 随掌段运动（反根后驱动本段）
    buildMotorSet(m0,K+'_m0',P.motorFrontY,P.motorMountY+P.motorRearOverhang,pr.collarY1,pr.collarBoltY);
    F.motors.push(m0);
    F.tendons.push(buildTendon(palmGroup,K+'_t0'));

    // —— 被驱动段 P1..P(n−1) 与末端段 Pn：先按正向层级建好（网格坐标一行不改），随后整体反根重挂 ——
    let parent = palmGroup;
    for (let k = 0; k < N; k++) {
      const g = new THREE.Group(); g.name = K+'_phalanx'+(k+1);
      if (k > 0) g.position.set(0,-P.phalanx1Len*s,0);
      parent.add(g); F.groups.push(g);
      const pfx = K+'_p'+(k+1);
      if (k < N-1) {
        const u = buildDrivenPhalanx(g, pfx, P.phalanx1Len, K+'_m'+(k+1), K+'_t'+(k+1));
        F.motors.push(u.motor); F.tendons.push(u.tendon);
      } else {
        buildTerminalPhalanx(g, pfx, q);
      }
      parent = g;
    }

    // —— 展开/并拢副：固定侧挂 root（安装件侧），转动侧挂 spread（指根侧）——
    F.spreadUnit = buildSpreadUnit(root, spread, K);
    // —— 掌部安装件（方块+56×56法兰）改为“固定件”：整组搬到 root 下，世界位姿逐点保持不变 ——
    //    原因：方块经 4×M4 锁在法兰上、法兰经 4×M5 锁在掌骨板上，物理上不能随指根摆；
    //    铰链把“方块以上”与“指根段以下”分开，因此安装件必须留在固定侧。
    root.updateWorldMatrix(true, true);
    const mAsm = root.getObjectByName(q + 'MountAsm');
    if (mAsm) {
      const wp = new THREE.Vector3(), wq = new THREE.Quaternion(), ws = new THREE.Vector3();
      mAsm.matrixWorld.decompose(wp, wq, ws);
      const rq = new THREE.Quaternion().setFromRotationMatrix(root.matrixWorld).invert();
      const lp = wp.clone().applyMatrix4(new THREE.Matrix4().copy(root.matrixWorld).invert());
      root.add(mAsm); mAsm.position.copy(lp); mAsm.quaternion.copy(rq.multiply(wq)); mAsm.scale.copy(ws);
      F.mountAsm = mAsm;
    }

    // —— 反根重挂：Pn 固定于 chainRoot；P(n−1)…掌段 各套关节组 joints[j]，绕 Oj 转 −θj ——
    //    段 j 的原点 = 其近端关节 O(j−1)，位于 Oj 上方 300mm（掌段原点即 O0，与其近端关节重合）
    const G = F.groups;
    const term = G[N];
    chainRoot.add(term);
    term.position.set(0, -P.phalanx1Len*(N-1)*s, 0);
    let host = term;
    for (let j = N-1; j >= 0; j--) {
      const W = new THREE.Group(); W.name = K+'_j'+j;
      host.add(W); W.position.set(0,0,0);
      F.joints[j] = W;
      W.add(G[j]);
      G[j].position.set(0, (j === 0 ? 0 : P.phalanx1Len)*s, 0);
      host = G[j];
    }
    return F;
  }
  // ============ 掌体骨架（共 16 个网格 / 8 个打印件）：掌骨板A/B + 顶部拼接条 + 腕拼接块(含4凸台) + 拇指桥(含4凸台） ============
  //   坐标 = 掌体系（= 世界系）：五指 MCP 共线于 y=0，掌段沿 +y 伸出，掌骨法兰顶面 y=326
  //   掌骨板 = 66(x)×10(y) 平板，z∈[−253,153]，在 z=−55 处断开为 A/B 两件（198/208mm，均 < 220mm 打印床）
  //   指根接口：每指 4×Ø4.2（掌骨板侧 M5 螺纹底孔）+ 4×Ø9（让开指根法兰顶面的 M4 螺栓头，与 rootBoltXZ 同心）+ Ø9 走线孔
  //   拼接：顶部拼接条（y=336..342）用 4×M5 从下方穿过掌骨板旋入拼接条，把 A/B 直接拉成一体；
  //   腕拼接块（y=342..374）再以 4×M5（z=−135/−135 落在无指根法兰的空档）+4×Ø14×6 支承凸台把腕接口与掌骨板连成一体
  //   拇指桥（y=336..346，z∈[−252,−145]）压在掌骨板A 上：2×M5 旋入板A，4×Ø14×10 凸台落在随 spin 滚转的拇指法兰孔上
  function flatPlateXZ(name, x0,x1, z0,z1, y0,y1, holes, mat) {
    const sh = new THREE.Shape();
    sh.moveTo(x0*s, z0*s); sh.lineTo(x1*s, z0*s); sh.lineTo(x1*s, z1*s); sh.lineTo(x0*s, z1*s); sh.closePath();
    for (const h of holes) { const p=new THREE.Path(); p.absarc(h[0]*s, h[1]*s, h[2]*s, 0, Math.PI*2, true); sh.holes.push(p); }
    const g = new THREE.ExtrudeGeometry(sh, {depth:(y1-y0)*s, bevelEnabled:false, steps:1});
    g.translate(0,0,-(y1-y0)/2*s);
    const m = new THREE.Mesh(g, mat);
    m.name = name; m.castShadow = m.receiveShadow = true;
    m.rotation.x = Math.PI/2;                 // 形面(x,z) → 世界(x,z)，挤出方向 → 世界 y
    m.position.y = (y0+y1)/2*s;
    return m;
  }
  // 指根接口孔组：4×Ø4.2（M5 螺纹底孔）+ 4×Ø9（M4 头让位，与 rootBoltXZ 同心）+ Ø9 走线（随该指 spin 滚转）
  function fingerHoles(f) {
    const th = f.spin*Math.PI/180, zc = f.pos[2], out = [];
    const R = function(x,z){ return [x*Math.cos(th)+z*Math.sin(th), zc - x*Math.sin(th)+z*Math.cos(th)]; };
    for (const hz of [[22,22],[22,-22],[-22,22],[-22,-22]]) { const p=R(hz[0],hz[1]); out.push([p[0], p[1], 2.1]); }
    for (const hz of P.print.rootBoltXZ) { const p=R(hz[0],hz[1]); out.push([p[0], p[1], 4.5]); }
    out.push([0, zc, 4.5]);
    return out;
  }
  function yOf(key){ return HAND.fingers.filter(function(f){ return f.key===key; })[0]; }
  function buildChassis() {
    const y0 = HAND.plateY0, y1 = HAND.plateY0 + HAND.plateT;   // 326..336
    const zS = HAND.plateSplit;                                 // −55 分缝（落在无指根法兰的 z 空档 −62..−48 内）
    const SB = HAND.spliceTop, WB = HAND.wristBlock, TB = HAND.thumbBridge;
    // 掌骨板A：拇指 + 食指（z∈[−253,−55]）+ 顶部拼接条 4×M5 过孔（同为无指根法兰空档）
    const hoA = fingerHoles(yOf('thumb')).concat(fingerHoles(yOf('index')))
      .concat(SB.bolts.map(function(b){ return [b[0], b[1], 2.75]; }))
    // 掌骨板B：中指 + 无名指 + 小指（z∈[−55,153]）
    const hoB = fingerHoles(yOf('middle')).concat(fingerHoles(yOf('ring'))).concat(fingerHoles(yOf('pinky')));
    scene.add(flatPlateXZ('palmPlateA', -33,33, HAND.plateZ0, zS, y0,y1, hoA, MAT.upperArm));
    scene.add(flatPlateXZ('palmPlateB', -33,33, zS, HAND.plateZ1, y0,y1, hoB, MAT.upperArm));
    // 顶部拼接条：6mm 厚，跨在分缝上；4×Ø4.2 攻 M5（自下而上穿板旋入），把 A/B 直接连成一体
    scene.add(flatPlateXZ('palmSpliceTop', -33,33, SB.z0, SB.z1, y1, SB.y1,
      SB.bolts.map(function(b){ return [b[0], b[1], 2.1]; }), MAT.upperArm));
    // 腕拼接块：4×Ø5.5（旋入掌骨板）+ Ø40 走线孔 + 4×Ø9 腕接口（M8 过孔）
    const hoW = [[0,0,20.0]].concat(WB.bolts.map(function(b){ return [b[0], b[1], 2.75]; }))
      .concat([[28,45,4.5],[28,-45,4.5],[-28,45,4.5],[-28,-45,4.5]]);
    scene.add(flatPlateXZ('wristBlock', -40,40, WB.z0, WB.z1, WB.y0, WB.y1, hoW, MAT.upperArm));
    let bi = 0;
    for (const b of WB.bolts) {   // 4×Ø14×6 支承凸台：垫在掌骨板与腕块之间（内含 M5 过孔）
      const bs = createBoredDisc(7, 2.75, 6, MAT.upperArm);
      bs.name = 'wristBoss' + (++bi);
      bs.position.set(b[0]*s, (y1 + 3)*s, b[1]*s);
      scene.add(bs);
    }
    // 拇指桥：2×M5 旋入掌骨板A + 4×Ø4.2（自下而上旋入桥体，锁住拇指法兰）
    const th = yOf('thumb'), th2 = th.spin*Math.PI/180;
    const hoT = TB.bolts.map(function(b){ return [b[0], b[1], 2.75]; });
    const bossPos = [];
    for (const hz of [[22,22],[22,-22],[-22,22],[-22,-22]]) {
      const pz = [hz[0]*Math.cos(th2)+hz[1]*Math.sin(th2), th.pos[2] - hz[0]*Math.sin(th2)+hz[1]*Math.cos(th2)];
      bossPos.push(pz);
      hoT.push([pz[0], pz[1], 2.1]);
    }
    scene.add(flatPlateXZ('thumbBridge', -33,33, TB.z0, TB.z1, y1, TB.y1, hoT, MAT.upperArm));
    let ci = 0;
    for (const pz of bossPos) {   // 4×Ø14×10 支承凸台：垫在拇指法兰与桥体之间（内含 M5 过孔）
      const bs = createBoredDisc(7, 2.75, 10, MAT.upperArm);
      bs.name = 'thumbBridgeBoss' + (++ci);
      bs.position.set(pz[0]*s, (y1 + 5)*s, pz[1]*s);
      scene.add(bs);
    }
  }

  // ============ 装配：骨架 + 五根手指（四指 3 关节 + 拇指 2 关节 = 14 个关节单元） ============
  buildChassis();
  for (const f of HAND.fingers) buildFinger(f);
  updateTrail();
}

function buildBodyOutline() { bodyOutline = null; }  // 整手模式无人形轮廓

function createTextSprite(text, color) {
  color = color || '#7c8aff';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 36px Arial';
  const w = ctx.measureText(text).width + 20;
  canvas.width = w; canvas.height = 50;
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = color;
  ctx.fillText(text, 10, 38);
  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(w * 0.15, 50 * 0.15, 1);
  return sprite;
}

// --- 反根单指链：局部关节坐标（根局部系）+ 世界坐标（场景单位 mm×s） ---
//   反根后固定端 = 末端段 Pn（接掌），自由端 = 掌段（原指根端，现为指尖）。
//   段 j 的原点 = 其近端关节 O(j−1)；段 j+1 的原点即关节 Oj。只有段 n 固定（θn = 0）。
//   相对转角与正向完全相同（段 j+1 相对段 j 转 +tj），只是累加方向相反：θj = θ(j+1) − tj。
//   网格原始坐标（“正向坐标”，掌段在上）经 chainRoot 绕 Z 镜像后即装配位；
//   Ol/Bl/Dl 是段局部系值（与正向逐项一致，供电机/连杆就地摆位），O/B/D 是镜像后的根局部系值。
function fingerChain(key, angles) {
  const F = FINGERS[key];
  const n = angles.length;
  const t = angles.map(function(a){ return a*Math.PI/180; });
  const st = angles.map(function(a){ return angleToStroke(a); });
  const rot = function(x,y,th){ return {x:x*Math.cos(th)-y*Math.sin(th), y:x*Math.sin(th)+y*Math.cos(th)}; };
  const Dloc = function(th){ return {x:P.forearmAttachOffset*Math.cos(th)+P.forearmAttachDist*Math.sin(th),
                                   y:P.forearmAttachOffset*Math.sin(th)-P.forearmAttachDist*Math.cos(th)}; };
  const M = (P.upperArmLen - P.phalanx1Len*(n-1) - P.forearmLen)/2;   // 反根镜像面 y=M
  const mir = function(p){ return {x:-p.x, y:2*M - p.y}; };
  const th = new Array(n+1); th[n] = 0;
  for (let k = n-1; k >= 0; k--) th[k] = th[k+1] - t[k];
  const pos = new Array(n+1);
  pos[n] = {x:0, y:-P.phalanx1Len*(n-1)};                             // 段 n 原点 = O(n−1)：固定
  for (let k = n-1; k >= 1; k--) { const o = rot(0, P.phalanx1Len, th[k]); pos[k] = {x:pos[k+1].x+o.x, y:pos[k+1].y+o.y}; }
  pos[0] = {x:pos[1].x, y:pos[1].y};                                  // 掌段原点 = O0
  const world = function(p){
    const v = new THREE.Vector3(p.x*s, p.y*s, 0);
    v.applyQuaternion(F.chainRoot.quaternion); v.add(F.chainRoot.position);
    v.applyQuaternion(F.root.quaternion); v.add(F.root.position);
    return v;
  };
  const Ol=[], Bl=[], Dl=[], O=[], B=[], D=[], OW=[], BW=[], DW=[];
  for (let k = 0; k < n; k++) {
    const off = (k === 0 ? 0 : -P.phalanx1Len);
    const bl = {x:P.motorMountX, y:off + P.motorMountY - st[k]};      // 段 k 局部系（与正向逐项一致）
    const d0 = Dloc(t[k]); const dl = {x:d0.x, y:d0.y + off};
    const ol = {x:0, y:off};
    const o = pos[k+1];                                               // 正向坐标下的关节 Oj
    const bq = rot(bl.x, bl.y, th[k]);
    const b = {x:pos[k].x + bq.x, y:pos[k].y + bq.y};                 // B 在段 k 上，随之转 θk
    const dq = rot(P.forearmAttachOffset, -P.forearmAttachDist, th[k+1]);
    const d = {x:o.x + dq.x, y:o.y + dq.y};                           // D 在段 k+1 上，随之转 θ(k+1)
    Ol.push(ol); Bl.push(bl); Dl.push(dl);
    O.push(mir(o)); B.push(mir(b)); D.push(mir(d));
    OW.push(world(o)); BW.push(world(b)); DW.push(world(d));
  }
  const tipL = {x:0, y:P.upperArmLen + 14};                           // 指尖防滑垫中心（掌段局部系）
  const tq = rot(tipL.x, tipL.y, th[0]);
  const tip = world({x:pos[0].x + tq.x, y:pos[0].y + tq.y});
  return { key:key, n:n, angles:angles.slice(), Ol:Ol, Bl:Bl, Dl:Dl, O:O, B:B, D:D,
           OW:OW, BW:BW, DW:DW, tipL:tipL, tip:tip, s:st, th:th, pos:pos };
}
function getJoints(pose) {
  const src = pose || currentPose(), out = {};
  for (const f of HAND.fingers) {
    const a = clampPose(f.key, (src[f.key] !== undefined ? src[f.key] : (FINGERS[f.key] ? FINGERS[f.key].pose : null)));
    out[f.key] = fingerChain(f.key, a);
  }
  return out;
}

function updateLabels() {
  labels.forEach(function(l){ scene.remove(l); if (l.material.map) l.material.map.dispose(); l.material.dispose(); });

  const C = getJoints(currentPose());
  const put = function(txt, color, v){ const l = createTextSprite(txt, color); l.position.copy(v); scene.add(l); labels.push(l); };
  for (const f of HAND.fingers) {

function updateTrail() {
  trailLines.forEach(function(l){ scene.remove(l); if (l.geometry) l.geometry.dispose(); });
  trailLines = [];
  if (!showTrail) return;
  for (const f of HAND.fingers) {
    if (!FINGERS[f.key]) continue;
    const pts = [];
    for (let i = 0; i <= 50; i++) {
      const u = i / 50;
      pts.push(fingerChain(f.key, f.limits.map(function(l){ return l*u; })).tip);
    }
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), MAT.trail);
    line.name = f.key + '_trail';
    scene.add(line); trailLines.push(line);

}

function updateRodUnit(motorGroup,pfx,noseY,Bx,By){
  const pr=P.print;
  const rod=motorGroup.getObjectByName(pfx+'ExposedRod');
  const rt=motorGroup.getObjectByName(pfx+'RodThreadStub');
  const bC=motorGroup.getObjectByName(pfx+'BClevis');
  if(rod){
    const len=noseY-(By+pr.rodTipAboveB+pr.rodThreadLen);
    rod.visible=len>0.5;
    rod.scale.y=Math.max(0.001,len)/100;
    rod.position.set(Bx*s,(noseY+By+pr.rodTipAboveB+pr.rodThreadLen)/2*s,0);
  }
  if(rt){
    const sl=Math.min(pr.rodThreadLen,noseY-(By+pr.rodTipAboveB));
    rt.visible=sl>0.2;
    rt.scale.y=Math.max(0.001,sl)/pr.rodThreadLen;
    rt.position.set(Bx*s,(By+pr.rodTipAboveB+sl/2)*s,0);
  }
  if(bC) bC.position.set(Bx*s,By*s,0);
}
function updateTendon(group,B,D){
  group.position.set((B.x+D.x)/2*s,(B.y+D.y)/2*s,0);
  group.rotation.z=Math.atan2(D.x-B.x,-(D.y-B.y));
  group.scale.set(1,1,1);
}

// 更新全部 5 指：pose = {指key:[角度...]}（缺省 = 保持当前）
function updateMechanism(pose){
  if (pose) for (const k in pose) if (FINGERS[k]) FINGERS[k].pose = clampPose(k, pose[k]);
  for (const f of HAND.fingers) {
    const F = FINGERS[f.key]; if (!F) continue;
    const A = F.pose, n = F.n;
    // 反根链：段 j 绕自身远端关节 Oj 转 −θj（相对转角与正向完全相同，只是父段换成远端段）
    for (let k = 0; k < n; k++) F.joints[k].rotation.z = -A[k]*Math.PI/180;
    const C = fingerChain(f.key, A);
    // 单元0：电机0/连杆0 挂在根（掌段固定，局部系即根系）
    updateRodUnit(F.motors[0], f.key+'_m0', P.motorFrontY, P.motorMountX, C.Bl[0].y);
    updateTendon(F.tendons[0], C.Bl[0], C.Dl[0]);
    // 单元 k≥1：电机 k/连杆 k 挂在段 k（局部原点 = 关节 k−1）
    for (let k = 1; k < n; k++) {
      updateRodUnit(F.motors[k], f.key+'_m'+k, -P.phalanx1Len+P.motorFrontY, C.Bl[k].x, C.Bl[k].y);
      updateTendon(F.tendons[k], C.Bl[k], C.Dl[k]);
    }
    // 展开/并拢：指根绕 x 转 φ，推杆 + BD 连杆按闭合关系逐帧摆位（|BD| ≡ L = 85 恒等）
    const phi = (F.spread || 0) * Math.PI/180;
    if (F.spreadGroup) F.spreadGroup.rotation.x = phi;
    if (F.spreadUnit) {
      const R = SPREAD.crankR, L = P.tendonLinkLen;
      const Dy = -R*Math.sin(phi), Dz = R*Math.cos(phi);
      const By = Dy - Math.sqrt(L*L - (R - Dz)*(R - Dz));
      updateRodUnit(F.spreadUnit.motor, f.key+'_sp', SPREAD.noseY, P.motorMountX, By);
      updateTendon(F.spreadUnit.link, {x:R, y:By}, {x:Dz, y:Dy});
    }
  }
  updateLabels();
  updateLiveData();
}
function updateLiveData() {
  const C = getJoints(currentPose());
  let out = "", tot = 0, maxF = 0;
  for (const f of HAND.fingers) {
    const c = C[f.key]; if (!c) continue;
    const parts = [], ta = [];
    for (let i = 0; i < f.n; i++) {
      const stk = P.s_extended - c.s[i];
      const fd = getForceData(c.angles[i]);
      tot += stk; if (fd.forceN > maxF) maxF = fd.forceN;
      parts.push(stk.toFixed(1));
      ta.push(transmissionAngle(c.angles[i]).toFixed(0));
    }
    out += '<b>' + f.label + '</b> ' + c.angles.map(function(a){ return a.toFixed(1); }).join(' / ') + '°';
    out += ' · 行程 ' + parts.join('/') + ' mm<br>';
    out += '<span class=hl>传动角</span> ' + ta.join('/') + '° · 指尖 y ' + (c.tip.y/s).toFixed(0) + ' mm<br>';
  }
  out += '<b>合计</b> 14 关节总行程 <span class=highlight>' + tot.toFixed(1) + ' mm</span> · 峰值理想静载力 ' + maxF.toFixed(1) + ' N<br>';
  out += '<b>关节</b>: 14 个可拆肩螺栓单元（四指 3 + 拇指 2，几何逐件相同）';
  document.getElementById('live-data').innerHTML = out;
}

function animate() {
  requestAnimationFrame(animate);
  if (isPlaying) {
    animU += animDir * animSpeed * 0.004;
    if (animU >= 1) { animU = 1; animDir = -1; }
    if (animU <= 0) { animU = 0; animDir = 1; }
    setPose(gripPose(animU, 1.0));
  }
  controls.update();
  renderer.render(scene, camera);
}

function animateCamera(tx, ty, tz) {
  const start = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
  const end = { x: tx, y: ty, z: tz };
  const duration = 800, startTime = Date.now();
  function step() {
    const t = Math.min((Date.now() - startTime) / duration, 1);
    const ease = t * (2 - t);
    camera.position.x = start.x + (end.x - start.x) * ease;
    camera.position.y = start.y + (end.y - start.y) * ease;
    camera.position.z = start.z + (end.z - start.z) * ease;
    camera.lookAt(0, -150 * s, 0);
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

initScene();
buildMechanism();
updateMechanism();
setupUI();
animate();
</script>
