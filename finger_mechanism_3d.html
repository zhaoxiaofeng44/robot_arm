<style>

  .panel-section h3 { font-size: 13px; color: #a0a0d0; margin-bottom: 8px; }

  button:hover { background: #3a3a7a; border-color: #6a6aba; }
  .info-box { background: rgba(20,20,40,0.8); border: 1px solid rgba(60,60,120,0.3); border-radius: 8px; padding: 10px; font-size: 11px; color: #9090b0; line-height: 1.6; }

<body>
<div id="canvas-container"></div>
<div id="loading">加载中...</div>
<div id="control-panel" style="display:none;">
  <h2>三节手指 · 两个可拆关节单元拼接 · 双电机驱动</h2>
  <div class="panel-section">

    <div class="slider-group"><label>近端关节角 PIP <span class="value" id="angle1-val">0.0°</span></label><input type="range" id="angle1-slider" min="0" max="120" value="0" step="0.5"></div>

    <div class="slider-group"><label>动画速度 <span class="value" id="speed-val">1.0x</span></label><input type="range" id="speed-slider" min="0.1" max="3.0" value="1.0" step="0.1"></div>

    <div class="btn-group" style="margin-top:8px;"><button id="btn-view-iso">等轴视图</button><button id="btn-view-front">正面视图</button><button id="btn-view-side">侧面视图</button></div>
  </div>
  <div class="panel-section">

  </div>
  <div class="panel-section"><h3>仿生类比</h3><div class="info-box" id="bio-info"></div></div>
  <div class="panel-section"><h3>机构参数</h3><div class="info-box" id="param-info"></div></div>
  <div class="panel-section"><h3>3D打印与拆装指南</h3><div class="info-box" id="print-info"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// 仿生三节手指 — 两个"当前肘关节机构"单元首尾拼接
//   单元k = 基节(带电机,叉耳) + 被动节(袖套+D侧板) + BD长条连杆，几何完全同v5
//   P1近节(300,接掌) ─关节1─ P2中节(300,=单元1前臂+单元2上臂的拼接件,载电机2) ─关节2─ P3远节(250,指尖)
//   电机2相对关节2的几何 = 电机1相对关节1（安装臂在指尖一侧逐级前移）
//   运动学零改动：每单元 A=(28,213)相对自身关节、BD=85、D=(14,-31)、行程59.393mm、0~120°
// ============================================================
//   · B叉头：开放双耳+夹持桥（M6螺母沉龛），连杆沿Z落入、销轴沿Z插入
//   · D叉耳：侧板贴前臂侧面（在连杆Z带之外），取消跨连杆的桥
//   · 电机：前法兰承推（安装板与上臂一体）+ 后部开口抱箍（2×M4锁臂侧）
//   · 运动学零改动：A=(28,213)、BD=85、D(θ)、行程59.39mm全部不变
// ============================================================

// --- 机构参数 ---
const P = {
  upperArmLen: 300,
  phalanx2Len: 300,          // P2中节：单元1前臂+单元2上臂的拼接件（载电机2）
  forearmLen: 250,
  motorMountY: 213,          // A点：行程基准（拉压反力由前法兰承担）
  motorMountX: 28,
  motorBodyLen: 80,          // v5：缸体缩短为80mm（行程不变），给B关节让出装拆空间
  motorRearOverhang: 4,      // 缸体后端面越过A点距离（前端面=137，落在上臂近端段内）
  motorBodyRadius: 18,
  tendonLinkLen: 85,
  tendonEffLen: 85,
  forearmAttachDist: 31,
  forearmAttachOffset: 14,
  elbowPinRadius: 5,
  linkPinRadius: 4,
  scale: 0.35,
  // ===== 3D打印（FDM，0.4mm喷嘴）与可拆装工艺参数 =====
  // 孔=销径+2×单边间隙，孔轴统一沿Z（=打印方向）；关节轴向每侧留1mm浮动
  print: {
    radialClearance: 0.3,      // 转动配合单边间隙 mm
    axialClearance: 1.0,       // 每个端面的轴向浮动间隙 mm（v4为0.5，v5加大便于拆装）
    chamfer: 1.0,              // 孔口45°导入倒角 mm
    wallMin: 3.0,              // 结构最小壁厚 mm
    layerHeight: 0.2,
    // BD长条连杆
    linkWidth: 15,             // 等宽长条宽度 mm（端部R7.5与杆身同宽，无环眼凸台）
    linkThickness: 8,          // Z向厚度（层堆叠方向）
    // O肘
    earPlateThickness: 5,      // O叉耳耳片厚度
    earBossRadius: 10,         // O耳凸台半径（孔壁4.7）
    sleeveOuterDia: 20,        // 肘轴套外径（v4为22；Ø20使长条连杆全行程避让，壁厚4.7）
    sleeveThickness: 14,       // 轴套长度（耳内档16 − 2×1.0浮动）
    // B推杆叉头（独立打印件，螺母沉龛夹持电机推杆端螺纹）
    clevisPlateZ: 7,           // 叉耳板中心|z|（板厚4 → z=5..9）
    bridgeY0: 9, bridgeY1: 16, // 夹持桥y范围（B点上方9..16，避开连杆端部R7.5扫掠圆≥1.5mm）
    nutPocketAF: 10,           // M6螺母对边
    rodTipAboveB: 11.5,        // 推杆端部相对B点的下沉量（伸入沉龛，端面距龛底0.5mm）
    rodThreadLen: 12,          // 推杆端部螺纹段长度
    // D叉耳（与前臂上段同一打印件，侧板贴臂身侧面）
    dBossOD: 16, dBossT: 1,    // 内侧定位凸台（凸出1mm设定1mm轴向浮动）
    // 电机前法兰安装板（与上臂近端段一体；电机前法兰承推于其下面）
    flangePlateY0: 141, flangePlateT: 8,
    flangeBoltXZ: [[12,13],[12,-13],[44,13],[44,-13]],   // 4×M4（穿过电机法兰旋入安装板）
    // 电机后部开口抱箍（独立打印件，2×M4贯穿上臂侧面）
    collarY0: 175, collarY1: 217,
    collarWall: 3, collarGapDeg: 60, ringClearance: 0.2,   // 抱箍内径=Ø36+0.2夹持间隙
    collarBoltY: [184, 209],
    // 可拆紧固件（外购标准件）：肩螺栓+平垫+尼龙自锁螺母
    boltElbow: { shank:10, shoulder:26, thread:8, head:16, headT:3,   washer:16, nutAF:13, nutH:6.5 }, // O
    boltB:     { shank:8,  shoulder:18, thread:6, head:14, headT:3,   washer:12, nutAF:10, nutH:5   }, // B
    boltD:     { shank:8,  shoulder:20, thread:6, head:14, headT:3,   washer:12, nutAF:10, nutH:5   }, // D（含1mm凸台）
    collarBolt:{ shank:4,  shoulder:22, thread:4, head:7.2, headT:3.6, washer:8,  nutAF:7,  nutH:3.2 }, // 抱箍2×M4
    // 一体化拼接（沿用v4）
    spliceYUpper: 140,
    spliceYForearm: -125,
    spliceFlangeT: 4,
    splicePadLen: 30,
    spliceLapPast: 5,
    spliceTongueLen: 15,
    spliceBoltDia: 4.4,
    spliceBoltInset: 5,
    spliceBoltOff: 6,
  },
};
const s = P.scale;
P.boreElbow = 2 * P.elbowPinRadius + 2 * P.print.radialClearance;    // Ø10.6
P.boreLink = 2 * P.linkPinRadius + 2 * P.print.radialClearance;      // Ø8.6
P.motorFrontY = P.motorMountY + P.motorRearOverhang - P.motorBodyLen; // 137：电机前端面/推杆出口

// --- 运动学（与v4完全一致，零改动） ---
function getDPoint(thetaDeg) {
  const theta = thetaDeg * Math.PI / 180;
  const dx = P.forearmAttachOffset * Math.cos(theta) - (-P.forearmAttachDist) * Math.sin(theta);
  const dy = P.forearmAttachOffset * Math.sin(theta) + (-P.forearmAttachDist) * Math.cos(theta);
  return { x: dx, y: dy };
}

function angleToStroke(thetaDeg) {
  const D = getDPoint(thetaDeg);
  const Ax = P.motorMountX, Ay = P.motorMountY;
  const ex = Ax - D.x;
  const ey = Ay - D.y;
  const val = P.tendonEffLen * P.tendonEffLen - ex * ex;
  if (val < 0) return -1;
  return ey - Math.sqrt(val);
}
P.s_extended = angleToStroke(0);
P.s_contracted = angleToStroke(120);
P.strokeMax = P.s_extended - P.s_contracted;

function strokeToAngle(stroke) {
  const u = Math.max(0, Math.min(P.strokeMax, Number(stroke)));
  if (u === 0) return 0;
  if (u === P.strokeMax) return 120;
  const targetS = P.s_extended - u;
  let lo = 0, hi = 120;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    if (angleToStroke(mid) > targetS) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function getStrokeFromAngle(thetaDeg) {
  return P.s_extended - angleToStroke(thetaDeg);
}

function getForceData(thetaDeg) {
  const t = thetaDeg * Math.PI / 180;
  const D = getDPoint(thetaDeg);
  const ex = P.motorMountX - D.x;
  const h = Math.sqrt(P.tendonLinkLen ** 2 - ex ** 2);
  const xp = -P.forearmAttachOffset * Math.sin(t) + P.forearmAttachDist * Math.cos(t);
  const J = D.x + ex * xp / h;
  const torque = 5 * 9.81 * P.forearmLen * Math.sin(t);
  return { J, forceN: torque / J, torqueNm: torque / 1000 };
}

function transmissionAngle(thetaDeg) {
  const D = getDPoint(thetaDeg);
  const sm = angleToStroke(thetaDeg);
  const Bx = P.motorMountX, By = P.motorMountY - sm;
  const BDx = D.x - Bx, BDy = D.y - By;
  const ODx = D.x, ODy = D.y;
  const dot = BDx * ODx + BDy * ODy;
  const magBD = Math.sqrt(BDx * BDx + BDy * BDy);
  const magOD = Math.sqrt(ODx * ODx + ODy * ODy);
  if (magBD < 0.001 || magOD < 0.001) return 90;
  return Math.acos(Math.min(1, Math.max(-1, Math.abs(dot) / (magBD * magOD)))) * 180 / Math.PI;
}

// --- Three.js ---
let scene, camera, renderer, controls;
let p1Group, p2Group, p3Group, motor1Group, motor2Group, tendon1Group, tendon2Group;
let trailLine, labels = [], bodyOutline;
let isPlaying = false, animDir = 1, animSpeed = 1.0, animCoupled = false;
function setPose(a1, a2) {
  angle1 = Math.max(0, Math.min(120, a1));
  angle2 = Math.max(0, Math.min(120, a2));
  document.getElementById('angle1-slider').value = angle1;
  document.getElementById('angle2-slider').value = angle2;
  updateMechanism(angle1, angle2);
  updateSliderLabels();
}
let angle1 = 0, angle2 = 0;
let showGrid = true, showLabels = true, showTrail = true, showBody = true;

const MAT = {
  upperArm: new THREE.MeshPhongMaterial({ color: 0x4488cc, shininess: 60, specular: 0x224466 }),
  forearm: new THREE.MeshPhongMaterial({ color: 0x44aacc, shininess: 60, specular: 0x224466 }),
  motorBody: new THREE.MeshPhongMaterial({ color: 0x333344, shininess: 80, specular: 0x6666aa }),
  motorRod: new THREE.MeshPhongMaterial({ color: 0xaaaacc, shininess: 100, specular: 0x6666aa }),
  tendon: new THREE.MeshPhongMaterial({ color: 0xff8844, shininess: 60, specular: 0x664422 }),
  joint: new THREE.MeshPhongMaterial({ color: 0xcc8800, shininess: 80, specular: 0x664400 }),
  bearing: new THREE.MeshPhongMaterial({ color: 0x888899, shininess: 100 }),
  bushing: new THREE.MeshPhongMaterial({ color: 0x334455, shininess: 40, specular: 0x8899aa }),
  bushingDS: new THREE.MeshPhongMaterial({ color: 0x3d5266, shininess: 40, specular: 0x8899aa, side: THREE.DoubleSide }),
  bearingDS: new THREE.MeshPhongMaterial({ color: 0x8899aa, shininess: 100, side: THREE.DoubleSide }),
  baseDS: new THREE.MeshPhongMaterial({ color: 0x555566, shininess: 30, side: THREE.DoubleSide }),
  fastener: new THREE.MeshPhongMaterial({ color: 0xb8bcc8, shininess: 120, specular: 0x777788 }),
  clamp: new THREE.MeshPhongMaterial({ color: 0x667080, shininess: 70, specular: 0x999aaa }),
  base: new THREE.MeshPhongMaterial({ color: 0x555566, shininess: 30 }),
  trail: new THREE.LineBasicMaterial({ color: 0xff4488, transparent: true, opacity: 0.5 }),
  body: new THREE.MeshPhongMaterial({ color: 0x222244, shininess: 10, transparent: true, opacity: 0.15 }),
};

function createBox(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function createCylinder(r, h, mat, segs) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segs || 32), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function createSphere(r, mat, segs) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, segs || 16, segs || 16), mat); m.castShadow = true; return m; }
function createZCylinder(r, h, mat, segs) { const m = createCylinder(r, h, mat, segs); m.rotation.x = Math.PI / 2; return m; }
// 六角螺母/柱（对边距af mm，高h mm，轴沿Z；内部统一×s）
function createZHexNut(af, h, mat) {
  const r = af * s / Math.sqrt(3);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h * s, 6), mat);
  m.castShadow = m.receiveShadow = true;
  m.rotation.x = Math.PI / 2;
  return m;
}
// --- 3D打印几何工具（全部按mm建模，再统一乘s缩放到场景） ---
function circlePath(r) { const p = new THREE.Path(); p.absarc(0, 0, r, 0, Math.PI * 2, true); return p; }
// 一体化搭接接头（沿用v4）：凸台直接长在两段臂身上，2×M4竖向贯穿夹紧
function addIntegralSplice(group, prefix, role, yMm, dir, halfWidthMm, halfThickMm, mat) {
  const pr = P.print, ft = pr.spliceFlangeT, pad = pr.splicePadLen;
  const bx = pr.spliceBoltInset, hr = pr.spliceBoltDia / 2, off = pr.spliceBoltOff;
  const by = yMm + dir * off;
  const zIn = halfThickMm + 0.5 * ft;
  const zUp = halfThickMm + 1.5 * ft;
  const mkPad = (nm, yA, yB, zc, punched) => {
    const y0 = Math.min(yA, yB), y1 = Math.max(yA, yB), cy = (y0 + y1) / 2;
    const holes = punched ? [[-bx, by - cy, hr], [bx, by - cy, hr]] : [];
    const p = createPlateWithHoles(2 * halfWidthMm, y1 - y0, ft, holes, mat);
    p.name = nm;
    p.position.set(0, cy * s, zc * s);
    group.add(p);
  };
  if (role === 'lead') {
    mkPad(prefix + 'SplicePadTop',    yMm - dir * pad, yMm + dir * (off + 2), zIn, true);
    mkPad(prefix + 'SplicePadBottom', yMm - dir * pad, yMm + dir * (off + 2), -zIn, true);
    return;
  }
  mkPad(prefix + 'SplicePadTopFoot',    yMm + dir * (off + 2), yMm + dir * pad, zIn, false);
  mkPad(prefix + 'SplicePadBottomFoot', yMm + dir * (off + 2), yMm + dir * pad, -zIn, false);
  mkPad(prefix + 'SplicePadTop',    yMm - dir * 2, yMm + dir * (off + 8), zUp, true);
  mkPad(prefix + 'SplicePadBottom', yMm - dir * 2, yMm + dir * (off + 8), -zUp, true);
  const span = halfThickMm + 2 * ft;
  for (const sx of [-bx, bx]) {
    const tag = sx < 0 ? 'L' : 'R';
    const bolt = createZCylinder(2 * s, (2 * span + 4) * s, MAT.fastener, 20);
    bolt.name = prefix + 'SpliceBolt' + tag;
    bolt.position.set(sx * s, by * s, 0);
    group.add(bolt);
    const head = createZCylinder(3.7 * s, 2.4 * s, MAT.fastener, 6);
    head.name = prefix + 'SpliceBoltHead' + tag;
    head.position.set(sx * s, by * s, (span + 1.2) * s);
    group.add(head);
    const nut = createZHexNut(7, 3, MAT.fastener);
    nut.name = prefix + 'SpliceBoltNut' + tag;
    nut.position.set(sx * s, by * s, -(span + 1.5) * s);
    group.add(nut);
  }
}

function createBoredPlate(shape, boreR, depthMM, mat) {
  if (boreR > 0) shape.holes.push(circlePath(boreR));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 32 });
  geo.translate(0, 0, -depthMM / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function createPlateWithHoles(w, h, depthMM, holes, mat) {
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, -h/2); shape.lineTo(w/2, -h/2); shape.lineTo(w/2, h/2); shape.lineTo(-w/2, h/2); shape.closePath();
  for (const [hx, hy, hr] of holes) { const p = new THREE.Path(); p.absarc(hx, hy, hr, 0, Math.PI*2, true); shape.holes.push(p); }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 24 });
  geo.translate(0, 0, -depthMM/2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function createBoredDisc(outerR, boreR, depthMM, mat) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
  return createBoredPlate(shape, boreR, depthMM, mat);
}
// 带多孔圆盘（电机前法兰：外圆+4×M4螺栓孔）
function createDiscWithHoles(outerR, holes, depthMM, mat) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
  for (const [hx, hy, hr] of holes) { const p = new THREE.Path(); p.absarc(hx, hy, hr, 0, Math.PI*2, true); shape.holes.push(p); }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 40 });
  geo.translate(0, 0, -depthMM / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// 回转体件（肘轴套/连杆端孔）：Lathe旋转成型，孔口自带45°×c导入倒角，孔轴沿Z
function createBushingRing(boreDia, outerDia, depthMM, chamferMM, mat) {
  const r = boreDia / 2, R = outerDia / 2, t = depthMM;
  const c = Math.max(0.2, Math.min(chamferMM, t / 2 - 0.05, (outerDia - boreDia) / 2 - 0.05));
  const pts = [
    new THREE.Vector2(R, 0), new THREE.Vector2(r + c, 0),
    new THREE.Vector2(r, c), new THREE.Vector2(r, t - c),
    new THREE.Vector2(r + c, t), new THREE.Vector2(R, t), new THREE.Vector2(R, 0),
  ];
  const geo = new THREE.LatheGeometry(pts, 32);
  geo.rotateX(Math.PI / 2);
  geo.translate(0, 0, -t / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// ============ 可拆肩螺栓组件（v5核心，替代v4单件肩铆钉） ============
// 塞打螺丝（光杆肩+端部螺纹）+ 平垫 + 尼龙自锁螺母，全部外购标准件，徒手工具即可反复拆装。
// 组件沿+Z装配：头贴−Z侧耳片外端面，光杆穿过耳片-浮动隙-连杆/轴套-浮动隙-耳片，
// 螺纹段伸出足够咬合平垫+自锁螺母。返回Group，子件命名<prefix>BoltHead/Shank/Thread/Washer/Nut。
function createShoulderBolt(prefix, spec, mat) {
  const g = new THREE.Group();
  g.name = prefix + 'BoltAssembly';
  const half = spec.shoulder / 2;
  const head = createZCylinder(spec.head / 2 * s, spec.headT * s, mat, 24);
  head.name = prefix + 'BoltHead';
  head.position.z = -(half + spec.headT / 2) * s;
  g.add(head);
  const shank = createZCylinder(spec.shank / 2 * s, spec.shoulder * s, mat, 32);
  shank.name = prefix + 'BoltShank';
  g.add(shank);
  const threadLen = spec.nutH + 1.6 + 4; // 螺母+平垫+2牙余量
  const thread = createZCylinder(spec.thread / 2 * s, threadLen * s, mat, 24);
  thread.name = prefix + 'BoltThread';
  thread.position.z = (half + threadLen / 2) * s;
  g.add(thread);
  const washer = createZCylinder(spec.washer / 2 * s, 1.6 * s, mat, 24);
  washer.name = prefix + 'BoltWasher';
  washer.position.z = (half + 0.8) * s;
  g.add(washer);
  const nut = createZHexNut(spec.nutAF, spec.nutH, mat);
  nut.name = prefix + 'BoltNut';
  nut.position.z = (half + 1.6 + spec.nutH / 2) * s;
  g.add(nut);
  return g;
}

  function buildPalmMount(parent, pfx) {
    const py = P.upperArmLen + 25;   // 法兰板下面y=325（P1掌端方块上端面之上）

    const c = 28, rc = 8;
    shp.moveTo(-c + rc, -c); shp.lineTo(c - rc, -c); shp.absarc(c - rc, -c + rc, rc, -Math.PI / 2, 0, false);
    shp.lineTo(c, c - rc); shp.absarc(c - rc, c - rc, rc, 0, Math.PI / 2, false);
    shp.lineTo(-c + rc, c); shp.absarc(-c + rc, c - rc, rc, Math.PI / 2, Math.PI, false);
    shp.lineTo(-c, -c + rc); shp.absarc(-c + rc, -c + rc, rc, Math.PI, Math.PI * 1.5, false);
    shp.closePath();
    const axisHole = new THREE.Path(); axisHole.absarc(0, 0, 4.5, 0, Math.PI * 2, true);

    for (const [hx, hy] of [[22,22],[22,-22],[-22,22],[-22,-22]]) {

      g.add(bolt);
      const head = createZCylinder(4.7 * s, 3 * s, MAT.fastener, 20);

  function buildFlangePlate(parent, pfx, fpY0) {
    const fpT = pr.flangePlateT;

  function buildMotorSet(motorGroup, pfx, frontY, rearY, collarTop, boltYs) {

    const flange = createDiscWithHoles(19,pr.flangeBoltXZ.map(([bx,bz])=>[bx-P.motorMountX,bz,2.3]),4,MAT.base);
    flange.name = pfx+'MotorFlange'; flange.rotation.x = Math.PI/2;
    flange.position.set(P.motorMountX*s,(frontY+4)*s,0); motorGroup.add(flange);
    pr.flangeBoltXZ.forEach(([bx,bz],i)=>{
      const bolt = createCylinder(pr.collarBolt.shank/2*s,12*s,MAT.fastener,20);
      bolt.name = pfx+'FlangeBolt'+(i+1); bolt.position.set(bx*s,(frontY+6)*s,bz*s); motorGroup.add(bolt);
      const head = createCylinder(3.5*s,4*s,MAT.fastener,24);
      head.name = pfx+'FlangeBolt'+(i+1)+'Head'; head.position.set(bx*s,(frontY-2)*s,bz*s); motorGroup.add(head);
    });
    const Rin = P.motorBodyRadius+pr.ringClearance, Rout = Rin+pr.collarWall;
    const gapRad = pr.collarGapDeg*Math.PI/180, a0 = Math.PI-gapRad/2;
    const rs = new THREE.Shape();
    rs.absarc(0,0,Rout,a0,a0+Math.PI*2-gapRad,false);
    rs.absarc(0,0,Rin,a0+Math.PI*2-gapRad,a0,true);
    rs.closePath();
    const rg = new THREE.ExtrudeGeometry(rs,{depth:pr.collarY1-pr.collarY0,bevelEnabled:false,steps:1,curveSegments:48});
    rg.scale(s,s,s);
    const ring = new THREE.Mesh(rg,MAT.clamp);

    motorGroup.add(ring);
    const zA=7,zB=11;

    ts.lineTo(-30,zB); ts.closePath();
    const hp = new THREE.Path(); hp.absarc(-26,9,pr.collarBolt.shank/2+0.2,0,Math.PI*2,true); ts.holes.push(hp);
    boltYs.forEach((y,i)=>{

      const tab = new THREE.Mesh(tg,MAT.clamp);

      motorGroup.add(tab);
      const bolt = createZCylinder(pr.collarBolt.shank/2*s,22*s,MAT.fastener,20);

      nut.name = pfx+'CollarBoltNut'+tag; nut.position.set(2*s,y*s,-(11+1.6+pr.collarBolt.nutH/2)*s); motorGroup.add(nut);
    });
    // 推杆（Ø8光杆+M6螺纹段）与B叉头（沉龛螺母夹持）
    const rodGroup = new THREE.Group(); rodGroup.name = pfx+'Rod';

    const rt = createCylinder(3.1*s,pr.rodThreadLen*s,MAT.motorRod,24); rt.name = pfx+'RodThreadStub'; rodGroup.add(rt);
    const bC = new THREE.Group(); bC.name = pfx+'BClevis';

    addB(mmBox(18,5,2*(9-pocketZ)),pfx+'BridgeWallZN',0,(by0+by1)/2+0.5,-(pocketZ+9)/2);
    addB(mmBox(2*(9-pocketX),5,2*pocketZ),pfx+'BridgeWallXP',(pocketX+9)/2,(by0+by1)/2+0.5,0);

    addB(mmBox(2,2.5,2*pocketZ),pfx+'BridgeRibL',-3.5,by0+1.25,0);
    addB(mmBox(2,2.5,2*pocketZ),pfx+'BridgeRibR',3.5,by0+1.25,0);
    for (const [tag,z] of [['L',pr.clevisPlateZ],['R',-pr.clevisPlateZ]]) {
      const arm = createPlateWithHoles(16,11.5,4,[],MAT.clamp);
      arm.name = pfx+'ClevisArm'+tag; arm.position.set(0,10.25*s,z*s); bC.add(arm);
      const plate = createBoredDisc(8,P.boreLink/2,4,MAT.clamp);

    }
    const bNut = createCylinder(pr.nutPocketAF/Math.sqrt(3)*s,5*s,MAT.fastener,6);
    bNut.name = pfx+'RodNut'; bNut.position.set(0,(by0+2.5)*s,0); bC.add(bNut);
    bC.add(createShoulderBolt(pfx+'b',pr.boltB,MAT.fastener));

  }
  function buildDrivenJoint(parent, pfx) {

  function waistShape(pfx, yEnd, halfEnd) {
    // 收窄腰身：0..-46 ±5.5（顶部R5.4缺口让Ø10销轴），-46..yEnd 接 halfEnd
    const sh = new THREE.Shape();
    const pts=[[-5.5,0],[-5.4,0],'ARC',[5.4,0],[5.5,0],[5.5,-46]];
    if (halfEnd !== 5.5) pts.push([halfEnd,-46]);
    pts.push([halfEnd,yEnd],[-halfEnd,yEnd]);
    if (halfEnd !== 5.5) pts.push([-halfEnd,-46]);
    pts.push([-5.5,-46]);
    pts.forEach((p,i)=>{
      if(p==='ARC'){sh.absarc(0,0,5.4*s,Math.PI,Math.PI*2,false);return;}
      if(i===0)sh.moveTo(p[0]*s,p[1]*s);else sh.lineTo(p[0]*s,p[1]*s);
    });
    sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh,{depth:12*s,bevelEnabled:false,steps:1,curveSegments:32});
    g.translate(0,0,-6*s);
    const m = new THREE.Mesh(g,MAT.forearm);

    return m;
  }

  // ============ P1 近节（基节300mm = v5上臂几何）：掌端=肩座，远端=关节1叉耳，电机1原位 ============
  p1Group = new THREE.Group(); p1Group.name = 'phalanx1';
  const syU = pr.spliceYUpper;
  const segs1 = [
    { name:'p1BodyDistal', pts:[[-3,13],[3,13],[8,22],[8,syU],[-8,syU],[-8,22]], holes:[] },
    { name:'p1BodyProximal', pts:[[-8,syU],[8,syU],[8,P.upperArmLen],[-8,P.upperArmLen]],
      holes: pr.collarBoltY.map(y => [2, y, pr.collarBolt.shank/2 + 0.2]) },
  ];
  for (const seg of segs1) {
    const sh = new THREE.Shape();
    seg.pts.forEach(([x,y],i)=>{ if(i===0) sh.moveTo(x*s,y*s); else sh.lineTo(x*s,y*s); });
    sh.closePath();
    for (const [hx,hy,hr] of seg.holes) { const p=new THREE.Path(); p.absarc(hx*s,hy*s,hr*s,0,Math.PI*2,true); sh.holes.push(p); }
    const g = new THREE.ExtrudeGeometry(sh,{depth:14*s,bevelEnabled:false,steps:1});
    g.translate(0,0,-7*s);
    const m = new THREE.Mesh(g,MAT.upperArm);
    m.name = seg.name; m.castShadow=m.receiveShadow=true;
    p1Group.add(m);
  }
  addIntegralSplice(p1Group,'p1D','lead',syU,1,8,7,MAT.upperArm);
  addIntegralSplice(p1Group,'p1P','lag',syU,1,8,7,MAT.upperArm);
  const palm = createBox(24*s,20*s,22*s,MAT.base);
  palm.name='p1PalmBase'; palm.position.y=(P.upperArmLen+10)*s;
  p1Group.add(palm);
  buildPalmMount(p1Group,'p1');
  buildFlangePlate(p1Group,'p1',pr.flangePlateY0);
  buildForkEars(p1Group,'p1',0,MAT.base);
  p1Group.add(createShoulderBolt('o1',pr.boltElbow,MAT.fastener));
  scene.add(p1Group);
  motor1Group = new THREE.Group(); motor1Group.name = 'motor1';
  buildMotorSet(motor1Group,'m1',P.motorFrontY,P.motorMountY+P.motorRearOverhang,pr.collarY1,pr.collarBoltY);
  scene.add(motor1Group);
  tendon1Group = buildTendon(scene,'t1');

  // ============ P2 中节（300mm 拼接件）：关节1端=袖套+D侧板（承接单元1），远端=关节2叉耳+电机2 ============
  p2Group = new THREE.Group(); p2Group.name = 'phalanx2';
  const sy2 = -170;                              // P2拼接线：让开电机2抱箍(y=-125..-83)与耳片(-282..)
  // 近端段两块（与肘版一致：腰身矩形±5.5使凸包核验真实；跟部±7带抱箍2×M4贯穿孔）
  p2Group.add(waistShape('p2BodyWaist',-46,5.5));
  {
    const sh2 = new THREE.Shape();
    [[-7,-46],[7,-46],[7,sy2],[-7,sy2]].forEach(([x,y],i)=>{ if(i===0)sh2.moveTo(x*s,y*s);else sh2.lineTo(x*s,y*s); });
    sh2.closePath();
    for (const y of [-116,-91]) { const p=new THREE.Path(); p.absarc(2*s,y*s,2.2*s,0,Math.PI*2,true); sh2.holes.push(p); }
    const g2 = new THREE.ExtrudeGeometry(sh2,{depth:12*s,bevelEnabled:false,steps:1});
    g2.translate(0,0,-6*s);
    const m2h = new THREE.Mesh(g2,MAT.forearm);
    m2h.name='p2BodyHeel'; m2h.castShadow=m2h.receiveShadow=true;
    p2Group.add(m2h);
  }
  p2Group.add(rectSegment('p2BodyDistal',sy2,-P.phalanx2Len,7,MAT.forearm));
  addIntegralSplice(p2Group,'p2P','lead',sy2,-1,7,6,MAT.forearm);
  addIntegralSplice(p2Group,'p2D','lag',sy2,-1,7,6,MAT.forearm);
  buildDrivenJoint(p2Group,'p2');                       // 关节1接口：袖套+D侧板（局部0,-31）
  buildForkEars(p2Group,'p2',-P.phalanx2Len,MAT.base);  // 关节2叉耳
  buildFlangePlate(p2Group,'p2',-P.phalanx2Len+pr.flangePlateY0);  // 电机2安装板（-159..-151）
  motor2Group = new THREE.Group(); motor2Group.name = 'motor2';
  p2Group.add(motor2Group);                             // 电机2随中节运动（安装臂在指尖一侧）
  buildMotorSet(motor2Group,'m2',-P.phalanx2Len+P.motorFrontY,-P.phalanx2Len+P.motorMountY+P.motorRearOverhang,
                -P.phalanx2Len+pr.collarY1,[-P.phalanx2Len+pr.collarBoltY[0],-P.phalanx2Len+pr.collarBoltY[1]]);
  tendon2Group = buildTendon(p2Group,'t2');

  // ============ P3 远节（250mm + 指尖）：关节2端=袖套+D侧板（承接单元2），末端=指尖圆头 ============
  p3Group = new THREE.Group(); p3Group.name = 'phalanx3';
  p3Group.position.set(0,-P.phalanx2Len*s,0);
  p2Group.add(p3Group);
  const sy3 = -125;
  p3Group.add(waistShape('p3BodyWaist',-46,5.5));
  p3Group.add(rectSegment('p3BodyHeel',-46,sy3,7,MAT.forearm));
  p3Group.add(rectSegment('p3BodyDistal',sy3,-P.forearmLen,7,MAT.forearm));
  addIntegralSplice(p3Group,'p3P','lead',sy3,-1,7,6,MAT.forearm);
  addIntegralSplice(p3Group,'p3D','lag',sy3,-1,7,6,MAT.forearm);
  buildDrivenJoint(p3Group,'p3');
  const tip = createCylinder(12*s,14*s,MAT.base,32);
  tip.name='p3FingerTip'; tip.position.set(0,(-P.forearmLen-7)*s,0);
  p3Group.add(tip);
  const pad = createSphere(12*s,MAT.base,24);
  pad.name='p3FingerTipPad'; pad.position.set(0,(-P.forearmLen-14)*s,0);
  p3Group.add(pad);
  // 指尖防滑抓握垫：掌侧扁平垫板22×18×4 + 3条横向防滑棱（翻转打印后自由成形）
  {
    const padC = createBox(22*s, 18*s, 4*s, MAT.base);
    padC.name = 'p3GripPad'; padC.position.set(0, -262*s, -12*s);
    p3Group.add(padC);
    for (let k = 0; k < 3; k++) {
      const rib = createBox(22*s, 3*s, 1.6*s, MAT.base);
      rib.name = 'p3GripRib' + (k + 1);
      rib.position.set(0, (-257 + k * 5) * s, -14.8 * s);
      p3Group.add(rib);
    }
  }
  scene.add(p2Group);

  updateTrail();
}

function createTextSprite(text, color) {
  color = color || '#7c8aff';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 36px Arial';
  const w = ctx.measureText(text).width + 20;
  canvas.width = w; canvas.height = 50;
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = color;
  ctx.fillText(text, 10, 38);
  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(w * 0.15, 50 * 0.15, 1);
  return sprite;
}

function updateLabels() {
  labels.forEach(l => {
    scene.remove(l);
    if (l.material.map) l.material.map.dispose();
    l.material.dispose();
  });
  labels = [];
  if (!showLabels) return;
  const J = getJoints(angle1, angle2);
  const put=(txt,color,x,y)=>{ const l=createTextSprite(txt,color); l.position.set(x*s+15,y*s,15); scene.add(l); labels.push(l); };
  put('P1 近节(基节)','#ff8844',20,P.upperArmLen-40);
  put('关节1 PIP','#ffaa44',20,10);
  put('关节2 DIP','#44ff88',J.O2.x+20,J.O2.y+10);
  put('P3 远节·指尖','#ff66aa',J.O2.x+20,J.O2.y-120);
  put('θ1='+angle1.toFixed(1)+'° θ2='+angle2.toFixed(1)+'°','#7c8aff',-40,-60);
}

function updateTrail() {
  if (trailLine) scene.remove(trailLine);
  if (!showTrail) return;
  const points = [];
  for (let a = 0; a <= 120; a += 3) {
    const J = getJoints(a, a);
    points.push(new THREE.Vector3(J.D2.x * s, J.D2.y * s, 0));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  trailLine = new THREE.Line(geo, MAT.trail);
  scene.add(trailLine);
}

// --- 关节中心（模型mm，世界系）与位置更新 ---
function getJoints(a1,a2){
  const t1=a1*Math.PI/180, t2=a2*Math.PI/180;
  const s1=angleToStroke(a1), s2=angleToStroke(a2);
  const rot=(x,y,t)=>({x:x*Math.cos(t)-y*Math.sin(t), y:x*Math.sin(t)+y*Math.cos(t)});
  const O1={x:0,y:0};
  const B1={x:P.motorMountX,y:P.motorMountY-s1};
  const D1=rot(P.forearmAttachOffset,-P.forearmAttachDist,t1);
  const O2=rot(0,-P.phalanx2Len,t1);
  const B2l={x:P.motorMountX,y:-P.phalanx2Len+P.motorMountY-s2};   // P2局部
  const D2r=rot(P.forearmAttachOffset,-P.forearmAttachDist,t2);
  const D2l={x:D2r.x, y:D2r.y-P.phalanx2Len};                      // P2局部
  const B2=rot(B2l.x,B2l.y,t1);                                     // 世界（标注用）
  const D2=rot(D2l.x,D2l.y,t1);
  return {O1,B1,D1,O2,B2,D2,B2l,D2l,s1,s2};
}
function updateRodUnit(motorGroup,pfx,noseY,Bx,By){
  const pr=P.print;
  const rod=motorGroup.getObjectByName(pfx+'ExposedRod');
  const rt=motorGroup.getObjectByName(pfx+'RodThreadStub');
  const bC=motorGroup.getObjectByName(pfx+'BClevis');
  if(rod){
    const len=noseY-(By+pr.rodTipAboveB+pr.rodThreadLen);
    rod.visible=len>0.5;
    rod.scale.y=Math.max(0.001,len)/100;
    rod.position.set(Bx*s,(noseY+By+pr.rodTipAboveB+pr.rodThreadLen)/2*s,0);
  }
  if(rt){
    const sl=Math.min(pr.rodThreadLen,noseY-(By+pr.rodTipAboveB));
    rt.visible=sl>0.2;
    rt.scale.y=Math.max(0.001,sl)/pr.rodThreadLen;
    rt.position.set(Bx*s,(By+pr.rodTipAboveB+sl/2)*s,0);
  }
  if(bC) bC.position.set(Bx*s,By*s,0);
}
function updateTendon(group,B,D){
  group.position.set((B.x+D.x)/2*s,(B.y+D.y)/2*s,0);
  group.rotation.z=Math.atan2(D.x-B.x,-(D.y-B.y));
  group.scale.set(1,1,1);
}
function updateMechanism(angleDeg1,angleDeg2){
  angle1 = Math.max(0, Math.min(120, Number(angleDeg1)));
  angle2 = Math.max(0, Math.min(120, Number(angleDeg2===undefined?0:angleDeg2)));
  p2Group.rotation.z = angle1*Math.PI/180;
  p3Group.rotation.z = angle2*Math.PI/180;
  const J = getJoints(angle1,angle2);
  // 单元1（世界系）
  updateRodUnit(motor1Group,'m1',P.motorFrontY,P.motorMountX,J.B1.y);
  updateTendon(tendon1Group,J.B1,J.D1);
  // 单元2（P2局部系：关节2=局部(0,-300)）
  const B2l={x:P.motorMountX,y:-P.phalanx2Len+P.motorMountY-J.s2};
  updateRodUnit(motor2Group,'m2',-P.phalanx2Len+P.motorFrontY,B2l.x,B2l.y);
  const t2=angle2*Math.PI/180;
  const D2l={x:P.forearmAttachOffset*Math.cos(t2)+P.forearmAttachDist*Math.sin(t2),
             y:P.forearmAttachOffset*Math.sin(t2)-P.forearmAttachDist*Math.cos(t2)};
  updateTendon(tendon2Group,B2l,{x:D2l.x, y:D2l.y-P.phalanx2Len});
  updateLabels();
  updateLiveData();
}

function animate() {
  requestAnimationFrame(animate);
  if (isPlaying) {
    angle1 += animDir * animSpeed * 0.5;
    if (angle1 >= 120) { angle1 = 120; animDir = -1; }
    if (angle1 <= 0) { angle1 = 0; animDir = 1; }
    angle2 = Math.min(angle1, 120 - angle1 * 0.5); // 播放演示：远端跟随卷曲（避免指尖与近节干涉的包络）
    document.getElementById('angle1-slider').value = angle1;
    document.getElementById('angle2-slider').value = angle2;
    updateMechanism(angle1, angle2);
    updateSliderLabels();
  } else if (animCoupled) {
    // PIP+DIP 联动演示：4秒往复正弦，θ2 = 0.8θ1（指尖垫保持与近节平行收拢）
    const ph = (Date.now() / 4000) * Math.PI * 2 * animSpeed;
    setPose(60 - 60 * Math.cos(ph), 0.8 * (60 - 60 * Math.cos(ph)));
  }
  controls.update();
  renderer.render(scene, camera);
}

function updateSliderLabels() {
  document.getElementById('angle1-val').textContent = angle1.toFixed(1) + '°';
  document.getElementById('angle2-val').textContent = angle2.toFixed(1) + '°';
  document.getElementById('speed-val').textContent = animSpeed.toFixed(1) + 'x';
}

  });
  document.getElementById('show-labels').addEventListener('change', function(e) { showLabels = e.target.checked; updateLabels(); });
  document.getElementById('show-trail').addEventListener('change', function(e) { showTrail = e.target.checked; updateTrail(); });
  document.getElementById('show-body').addEventListener('change', function(e) { showBody = e.target.checked; if (bodyOutline) bodyOutline.visible = showBody; });
  updateSliderLabels();
}

function animateCamera(tx, ty, tz) {
  var start = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
  var end = { x: tx, y: ty, z: tz };
  var duration = 800;
  var startTime = Date.now();
  function step() {
    var elapsed = Date.now() - startTime;
    var t = Math.min(elapsed / duration, 1);
    var ease = t * (2 - t);
    camera.position.x = start.x + (end.x - start.x) * ease;
    camera.position.y = start.y + (end.y - start.y) * ease;
    camera.position.z = start.z + (end.z - start.z) * ease;
    camera.lookAt(0, 50 * s, 0);
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

initScene();
buildMechanism();
updateMechanism(0);
setupUI();
animate();
</script>
