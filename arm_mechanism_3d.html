<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// 仿人手臂肘关节机构 v5 — 结构可拆化重构
//   · BD连杆 → 15mm等宽长条（100×15×8，R7.5圆弧端，孔壁3.2mm）
//   · 全部销轴关节：外购可拆肩螺栓（塞打螺丝）+ 平垫 + 尼龙自锁螺母（取消镦铆）
//   · B叉头：开放双耳+夹持桥（M6螺母沉龛），连杆沿Z落入、销轴沿Z插入
//   · D叉耳：侧板贴前臂侧面（在连杆Z带之外），取消跨连杆的桥
//   · 电机：前法兰承推（安装板与上臂一体）+ 后部开口抱箍（2×M4锁臂侧）
//   · 运动学零改动：A=(28,213)、BD=85、D(θ)、行程59.39mm全部不变
// ============================================================

// --- 机构参数 ---
const P = {
  upperArmLen: 300,
  forearmLen: 250,
  motorMountY: 213,          // A点：行程基准（拉压反力由前法兰承担）
  motorMountX: 28,
  motorBodyLen: 80,          // v5：缸体缩短为80mm（行程不变），给B关节让出装拆空间
  motorRearOverhang: 4,      // 缸体后端面越过A点距离（前端面=137，落在上臂近端段内）
  motorBodyRadius: 18,
  tendonLinkLen: 85,
  tendonEffLen: 85,
  forearmAttachDist: 31,
  forearmAttachOffset: 14,
  elbowPinRadius: 5,
  linkPinRadius: 4,
  scale: 0.35,
  // ===== 3D打印（FDM，0.4mm喷嘴）与可拆装工艺参数 =====
  // 孔=销径+2×单边间隙，孔轴统一沿Z（=打印方向）；关节轴向每侧留1mm浮动
  print: {
    radialClearance: 0.3,      // 转动配合单边间隙 mm
    axialClearance: 1.0,       // 每个端面的轴向浮动间隙 mm（v4为0.5，v5加大便于拆装）
    chamfer: 1.0,              // 孔口45°导入倒角 mm
    wallMin: 3.0,              // 结构最小壁厚 mm
    layerHeight: 0.2,
    // BD长条连杆
    linkWidth: 15,             // 等宽长条宽度 mm（端部R7.5与杆身同宽，无环眼凸台）
    linkThickness: 8,          // Z向厚度（层堆叠方向）
    // O肘
    earPlateThickness: 5,      // O叉耳耳片厚度
    earBossRadius: 10,         // O耳凸台半径（孔壁4.7）
    sleeveOuterDia: 20,        // 肘轴套外径（v4为22；Ø20使长条连杆全行程避让，壁厚4.7）
    sleeveThickness: 14,       // 轴套长度（耳内档16 − 2×1.0浮动）
    // B推杆叉头（独立打印件，螺母沉龛夹持电机推杆端螺纹）
    clevisPlateZ: 7,           // 叉耳板中心|z|（板厚4 → z=5..9）
    bridgeY0: 9, bridgeY1: 16, // 夹持桥y范围（B点上方9..16，避开连杆端部R7.5扫掠圆≥1.5mm）
    nutPocketAF: 10,           // M6螺母对边
    rodTipAboveB: 11.5,        // 推杆端部相对B点的下沉量（伸入沉龛，端面距龛底0.5mm）
    rodThreadLen: 12,          // 推杆端部螺纹段长度
    // D叉耳（与前臂上段同一打印件，侧板贴臂身侧面）
    dBossOD: 16, dBossT: 1,    // 内侧定位凸台（凸出1mm设定1mm轴向浮动）
    // 电机前法兰安装板（与上臂近端段一体；电机前法兰承推于其下面）
    flangePlateY0: 141, flangePlateT: 8,
    flangeBoltXZ: [[12,13],[12,-13],[44,13],[44,-13]],   // 4×M4（穿过电机法兰旋入安装板）
    // 电机后部开口抱箍（独立打印件，2×M4贯穿上臂侧面）
    collarY0: 175, collarY1: 217,
    collarWall: 3, collarGapDeg: 60, ringClearance: 0.2,   // 抱箍内径=Ø36+0.2夹持间隙
    collarBoltY: [184, 209],
    // 可拆紧固件（外购标准件）：肩螺栓+平垫+尼龙自锁螺母
    boltElbow: { shank:10, shoulder:26, thread:8, head:16, headT:3,   washer:16, nutAF:13, nutH:6.5 }, // O
    boltB:     { shank:8,  shoulder:18, thread:6, head:14, headT:3,   washer:12, nutAF:10, nutH:5   }, // B
    boltD:     { shank:8,  shoulder:20, thread:6, head:14, headT:3,   washer:12, nutAF:10, nutH:5   }, // D（含1mm凸台）
    collarBolt:{ shank:4,  shoulder:22, thread:4, head:7.2, headT:3.6, washer:8,  nutAF:7,  nutH:3.2 }, // 抱箍2×M4
    // 一体化拼接（沿用v4）
    spliceYUpper: 140,
    spliceYForearm: -125,
    spliceFlangeT: 4,
    splicePadLen: 30,
    spliceLapPast: 5,
    spliceTongueLen: 15,
    spliceBoltDia: 4.4,
    spliceBoltInset: 5,
    spliceBoltOff: 6,
  },
};
const s = P.scale;
P.boreElbow = 2 * P.elbowPinRadius + 2 * P.print.radialClearance;    // Ø10.6
P.boreLink = 2 * P.linkPinRadius + 2 * P.print.radialClearance;      // Ø8.6
P.motorFrontY = P.motorMountY + P.motorRearOverhang - P.motorBodyLen; // 137：电机前端面/推杆出口

// --- 运动学（与v4完全一致，零改动） ---
function getDPoint(thetaDeg) {
  const theta = thetaDeg * Math.PI / 180;
  const dx = P.forearmAttachOffset * Math.cos(theta) - (-P.forearmAttachDist) * Math.sin(theta);
  const dy = P.forearmAttachOffset * Math.sin(theta) + (-P.forearmAttachDist) * Math.cos(theta);
  return { x: dx, y: dy };
}

function angleToStroke(thetaDeg) {
  const D = getDPoint(thetaDeg);
  const Ax = P.motorMountX, Ay = P.motorMountY;
  const ex = Ax - D.x;
  const ey = Ay - D.y;
  const val = P.tendonEffLen * P.tendonEffLen - ex * ex;
  if (val < 0) return -1;
  return ey - Math.sqrt(val);
}
P.s_extended = angleToStroke(0);
P.s_contracted = angleToStroke(120);
P.strokeMax = P.s_extended - P.s_contracted;

function strokeToAngle(stroke) {
  const u = Math.max(0, Math.min(P.strokeMax, Number(stroke)));
  if (u === 0) return 0;
  if (u === P.strokeMax) return 120;
  const targetS = P.s_extended - u;
  let lo = 0, hi = 120;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    if (angleToStroke(mid) > targetS) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function getStrokeFromAngle(thetaDeg) {
  return P.s_extended - angleToStroke(thetaDeg);
}

function getForceData(thetaDeg) {
  const t = thetaDeg * Math.PI / 180;
  const D = getDPoint(thetaDeg);
  const ex = P.motorMountX - D.x;
  const h = Math.sqrt(P.tendonLinkLen ** 2 - ex ** 2);
  const xp = -P.forearmAttachOffset * Math.sin(t) + P.forearmAttachDist * Math.cos(t);
  const J = D.x + ex * xp / h;
  const torque = 5 * 9.81 * P.forearmLen * Math.sin(t);
  return { J, forceN: torque / J, torqueNm: torque / 1000 };
}

function transmissionAngle(thetaDeg) {
  const D = getDPoint(thetaDeg);
  const sm = angleToStroke(thetaDeg);
  const Bx = P.motorMountX, By = P.motorMountY - sm;
  const BDx = D.x - Bx, BDy = D.y - By;
  const ODx = D.x, ODy = D.y;
  const dot = BDx * ODx + BDy * ODy;
  const magBD = Math.sqrt(BDx * BDx + BDy * BDy);
  const magOD = Math.sqrt(ODx * ODx + ODy * ODy);
  if (magBD < 0.001 || magOD < 0.001) return 90;
  return Math.acos(Math.min(1, Math.max(-1, Math.abs(dot) / (magBD * magOD)))) * 180 / Math.PI;
}

// --- Three.js ---
let scene, camera, renderer, controls;
let upperArmGroup, forearmGroup, motorGroup, tendonGroup;
let trailLine, labels = [], bodyOutline;
let isPlaying = false, animDir = 1, animSpeed = 1.0;
let currentAngle = 0;
let showGrid = true, showLabels = true, showTrail = true, showBody = true;

const MAT = {
  upperArm: new THREE.MeshPhongMaterial({ color: 0x4488cc, shininess: 60, specular: 0x224466 }),
  forearm: new THREE.MeshPhongMaterial({ color: 0x44aacc, shininess: 60, specular: 0x224466 }),
  motorBody: new THREE.MeshPhongMaterial({ color: 0x333344, shininess: 80, specular: 0x6666aa }),
  motorRod: new THREE.MeshPhongMaterial({ color: 0xaaaacc, shininess: 100, specular: 0x6666aa }),
  tendon: new THREE.MeshPhongMaterial({ color: 0xff8844, shininess: 60, specular: 0x664422 }),
  joint: new THREE.MeshPhongMaterial({ color: 0xcc8800, shininess: 80, specular: 0x664400 }),
  bearing: new THREE.MeshPhongMaterial({ color: 0x888899, shininess: 100 }),
  bushing: new THREE.MeshPhongMaterial({ color: 0x334455, shininess: 40, specular: 0x8899aa }),
  bushingDS: new THREE.MeshPhongMaterial({ color: 0x3d5266, shininess: 40, specular: 0x8899aa, side: THREE.DoubleSide }),
  bearingDS: new THREE.MeshPhongMaterial({ color: 0x8899aa, shininess: 100, side: THREE.DoubleSide }),
  baseDS: new THREE.MeshPhongMaterial({ color: 0x555566, shininess: 30, side: THREE.DoubleSide }),
  fastener: new THREE.MeshPhongMaterial({ color: 0xb8bcc8, shininess: 120, specular: 0x777788 }),
  clamp: new THREE.MeshPhongMaterial({ color: 0x667080, shininess: 70, specular: 0x999aaa }),
  base: new THREE.MeshPhongMaterial({ color: 0x555566, shininess: 30 }),
  trail: new THREE.LineBasicMaterial({ color: 0xff4488, transparent: true, opacity: 0.5 }),
  body: new THREE.MeshPhongMaterial({ color: 0x222244, shininess: 10, transparent: true, opacity: 0.15 }),
};

function createBox(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function createCylinder(r, h, mat, segs) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segs || 32), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function createSphere(r, mat, segs) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, segs || 16, segs || 16), mat); m.castShadow = true; return m; }
function createZCylinder(r, h, mat, segs) { const m = createCylinder(r, h, mat, segs); m.rotation.x = Math.PI / 2; return m; }
// 六角螺母/柱（对边距af mm，高h mm，轴沿Z；内部统一×s）
function createZHexNut(af, h, mat) {
  const r = af * s / Math.sqrt(3);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h * s, 6), mat);
  m.castShadow = m.receiveShadow = true;
  m.rotation.x = Math.PI / 2;
  return m;
}
// --- 3D打印几何工具（全部按mm建模，再统一乘s缩放到场景） ---
function circlePath(r) { const p = new THREE.Path(); p.absarc(0, 0, r, 0, Math.PI * 2, true); return p; }
// 一体化搭接接头（沿用v4）：凸台直接长在两段臂身上，2×M4竖向贯穿夹紧
function addIntegralSplice(group, prefix, role, yMm, dir, halfWidthMm, halfThickMm, mat) {
  const pr = P.print, ft = pr.spliceFlangeT, pad = pr.splicePadLen;
  const bx = pr.spliceBoltInset, hr = pr.spliceBoltDia / 2, off = pr.spliceBoltOff;
  const by = yMm + dir * off;
  const zIn = halfThickMm + 0.5 * ft;
  const zUp = halfThickMm + 1.5 * ft;
  const mkPad = (nm, yA, yB, zc, punched) => {
    const y0 = Math.min(yA, yB), y1 = Math.max(yA, yB), cy = (y0 + y1) / 2;
    const holes = punched ? [[-bx, by - cy, hr], [bx, by - cy, hr]] : [];
    const p = createPlateWithHoles(2 * halfWidthMm, y1 - y0, ft, holes, mat);
    p.name = nm;
    p.position.set(0, cy * s, zc * s);
    group.add(p);
  };
  if (role === 'lead') {
    mkPad(prefix + 'SplicePadTop',    yMm - dir * pad, yMm + dir * (off + 2), zIn, true);
    mkPad(prefix + 'SplicePadBottom', yMm - dir * pad, yMm + dir * (off + 2), -zIn, true);
    return;
  }
  mkPad(prefix + 'SplicePadTopFoot',    yMm + dir * (off + 2), yMm + dir * pad, zIn, false);
  mkPad(prefix + 'SplicePadBottomFoot', yMm + dir * (off + 2), yMm + dir * pad, -zIn, false);
  mkPad(prefix + 'SplicePadTop',    yMm - dir * 2, yMm + dir * (off + 8), zUp, true);
  mkPad(prefix + 'SplicePadBottom', yMm - dir * 2, yMm + dir * (off + 8), -zUp, true);
  const span = halfThickMm + 2 * ft;
  for (const sx of [-bx, bx]) {
    const tag = sx < 0 ? 'L' : 'R';
    const bolt = createZCylinder(2 * s, (2 * span + 4) * s, MAT.fastener, 20);
    bolt.name = prefix + 'SpliceBolt' + tag;
    bolt.position.set(sx * s, by * s, 0);
    group.add(bolt);
    const head = createZCylinder(3.7 * s, 2.4 * s, MAT.fastener, 6);
    head.name = prefix + 'SpliceBoltHead' + tag;
    head.position.set(sx * s, by * s, (span + 1.2) * s);
    group.add(head);
    const nut = createZHexNut(7, 3, MAT.fastener);
    nut.name = prefix + 'SpliceBoltNut' + tag;
    nut.position.set(sx * s, by * s, -(span + 1.5) * s);
    group.add(nut);
  }
}

function createBoredPlate(shape, boreR, depthMM, mat) {
  if (boreR > 0) shape.holes.push(circlePath(boreR));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 32 });
  geo.translate(0, 0, -depthMM / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function createPlateWithHoles(w, h, depthMM, holes, mat) {
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, -h/2); shape.lineTo(w/2, -h/2); shape.lineTo(w/2, h/2); shape.lineTo(-w/2, h/2); shape.closePath();
  for (const [hx, hy, hr] of holes) { const p = new THREE.Path(); p.absarc(hx, hy, hr, 0, Math.PI*2, true); shape.holes.push(p); }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 24 });
  geo.translate(0, 0, -depthMM/2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function createBoredDisc(outerR, boreR, depthMM, mat) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
  return createBoredPlate(shape, boreR, depthMM, mat);
}
// 带多孔圆盘（电机前法兰：外圆+4×M4螺栓孔）
function createDiscWithHoles(outerR, holes, depthMM, mat) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
  for (const [hx, hy, hr] of holes) { const p = new THREE.Path(); p.absarc(hx, hy, hr, 0, Math.PI*2, true); shape.holes.push(p); }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depthMM, bevelEnabled: false, steps: 1, curveSegments: 40 });
  geo.translate(0, 0, -depthMM / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// 回转体件（肘轴套/连杆端孔）：Lathe旋转成型，孔口自带45°×c导入倒角，孔轴沿Z
function createBushingRing(boreDia, outerDia, depthMM, chamferMM, mat) {
  const r = boreDia / 2, R = outerDia / 2, t = depthMM;
  const c = Math.max(0.2, Math.min(chamferMM, t / 2 - 0.05, (outerDia - boreDia) / 2 - 0.05));
  const pts = [
    new THREE.Vector2(R, 0), new THREE.Vector2(r + c, 0),
    new THREE.Vector2(r, c), new THREE.Vector2(r, t - c),
    new THREE.Vector2(r + c, t), new THREE.Vector2(R, t), new THREE.Vector2(R, 0),
  ];
  const geo = new THREE.LatheGeometry(pts, 32);
  geo.rotateX(Math.PI / 2);
  geo.translate(0, 0, -t / 2);
  geo.scale(s, s, s);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// ============ 可拆肩螺栓组件（v5核心，替代v4单件肩铆钉） ============
// 塞打螺丝（光杆肩+端部螺纹）+ 平垫 + 尼龙自锁螺母，全部外购标准件，徒手工具即可反复拆装。
// 组件沿+Z装配：头贴−Z侧耳片外端面，光杆穿过耳片-浮动隙-连杆/轴套-浮动隙-耳片，
// 螺纹段伸出足够咬合平垫+自锁螺母。返回Group，子件命名<prefix>BoltHead/Shank/Thread/Washer/Nut。
function createShoulderBolt(prefix, spec, mat) {
  const g = new THREE.Group();
  g.name = prefix + 'BoltAssembly';
  const half = spec.shoulder / 2;
  const head = createZCylinder(spec.head / 2 * s, spec.headT * s, mat, 24);
  head.name = prefix + 'BoltHead';
  head.position.z = -(half + spec.headT / 2) * s;
  g.add(head);
  const shank = createZCylinder(spec.shank / 2 * s, spec.shoulder * s, mat, 32);
  shank.name = prefix + 'BoltShank';
  g.add(shank);
  const threadLen = spec.nutH + 1.6 + 4; // 螺母+平垫+2牙余量
  const thread = createZCylinder(spec.thread / 2 * s, threadLen * s, mat, 24);
  thread.name = prefix + 'BoltThread';
  thread.position.z = (half + threadLen / 2) * s;
  g.add(thread);
  const washer = createZCylinder(spec.washer / 2 * s, 1.6 * s, mat, 24);
  washer.name = prefix + 'BoltWasher';
  washer.position.z = (half + 0.8) * s;
  g.add(washer);
  const nut = createZHexNut(spec.nutAF, spec.nutH, mat);
  nut.name = prefix + 'BoltNut';
  nut.position.z = (half + 1.6 + spec.nutH / 2) * s;
  g.add(nut);
  return g;
}

  scene.add(pLight);

  gridHelper.position.y = -280 * s;

function buildMechanism() {
  const pr = P.print;
  // === 上臂：两段臂身 + 一体化肘叉耳 + 电机法兰安装板 ===
  upperArmGroup = new THREE.Group();
  upperArmGroup.name = 'upperArm';
  const syU = pr.spliceYUpper;
  const upperSegments = [
    // 端部收窄至y=13起（对角半径13.3 > 轴套回转半径10），让开Ø20轴套扫掠区
    { name: 'upperArmBodyDistal',   pts: [[-3,13],[3,13],[8,22],[8,syU],[-8,syU],[-8,22]], holes: [] },
    { name: 'upperArmBodyProximal', pts: [[-8,syU],[8,syU],[8,P.upperArmLen],[-8,P.upperArmLen]],
      // 抱箍2×M4贯穿孔（孔轴沿Z，真实通孔）
      holes: pr.collarBoltY.map(y => [2, y, pr.collarBolt.shank / 2 + 0.2]) },
  ];
  for (const seg of upperSegments) {
    const sh = new THREE.Shape();
    seg.pts.forEach(([x,y],i) => { if (i === 0) sh.moveTo(x*s,y*s); else sh.lineTo(x*s,y*s); });
    sh.closePath();
    for (const [hx,hy,hr] of seg.holes) { const p = new THREE.Path(); p.absarc(hx*s,hy*s,hr*s,0,Math.PI*2,true); sh.holes.push(p); }
    const g = new THREE.ExtrudeGeometry(sh, { depth:14*s, bevelEnabled:false, steps:1 });
    g.translate(0,0,-7*s);
    const m = new THREE.Mesh(g, MAT.upperArm);
    m.name = seg.name; m.castShadow = m.receiveShadow = true;
    upperArmGroup.add(m);
  }
  addIntegralSplice(upperArmGroup, 'upperArmD', 'lead', syU, 1, 8, 7, MAT.upperArm);
  addIntegralSplice(upperArmGroup, 'upperArmP', 'lag',  syU, 1, 8, 7, MAT.upperArm);

  const shoulder = createBox(24*s, 20*s, 22*s, MAT.base);
  shoulder.name = 'shoulder';
  shoulder.position.y = (P.upperArmLen + 10)*s;
  upperArmGroup.add(shoulder);

  // 电机前法兰安装板（与近端段一体，电机前法兰承推于其下面141平面）：
  //   颈部（贴臂身，z=±7内，避开拼接凸台z=±7..15）+ 宽板（x=9..47，包住Ø36.4导向孔与4×M4）
  const fpY0 = pr.flangePlateY0, fpT = pr.flangePlateT;
  const neck = createPlateWithHoles(18, 14, fpT, [], MAT.base);           // x:-8..10, z:-7..7（右缘10=电机包络左缘，留2mm名义间隙）
  neck.name = 'motorFlangePlateNeck';
  neck.rotation.x = Math.PI / 2;                    // 板面法线沿Y（挤出0..T → 世界-y）
  neck.position.set(1*s, (fpY0 + fpT)*s, 0);
  upperArmGroup.add(neck);
  // 宽板：x=9..47、z=±18.5，含Ø36.4推杆导向孔与4×M4螺栓孔（x≥9避开拼接凸台x=±8）
  const wideHoles = [[28, 0, P.motorBodyRadius + pr.radialClearance + 0.2]];           // Ø36.4推杆导向孔
  for (const [bx, bz] of pr.flangeBoltXZ) wideHoles.push([bx, bz, 2.2]);
  const wideGeoShape = new THREE.Shape();
  wideGeoShape.moveTo(9, -18.5); wideGeoShape.lineTo(47, -18.5); wideGeoShape.lineTo(47, 18.5); wideGeoShape.lineTo(9, 18.5); wideGeoShape.closePath();
  for (const [hx, hy, hr] of wideHoles) { const p = new THREE.Path(); p.absarc(hx, hy, hr, 0, Math.PI*2, true); wideGeoShape.holes.push(p); }
  const wideGeo = new THREE.ExtrudeGeometry(wideGeoShape, { depth: fpT, bevelEnabled: false, steps: 1, curveSegments: 32 });
  wideGeo.translate(0, 0, -fpT / 2);
  wideGeo.scale(s, s, s);
  const widePlate = new THREE.Mesh(wideGeo, MAT.base);
  widePlate.name = 'motorFlangePlate';
  widePlate.castShadow = widePlate.receiveShadow = true;
  widePlate.rotation.x = Math.PI / 2;
  widePlate.position.set(0, (fpY0 + fpT)*s, 0);
  upperArmGroup.add(widePlate);

  // 一体化肘叉耳（沿用v4布局，配合Ø20轴套与Ø10可拆肩螺栓）
  const earPlateT = pr.earPlateThickness;
  for (const [name,z] of [['elbowEarBaseLeft',-10.5],['elbowEarBaseRight',10.5]]) {
    const base = createBox(22*s, 18*s, earPlateT*s, MAT.base);
    base.name = name;
    base.position.set(0,17.5*s,z*s);
    upperArmGroup.add(base);
    const web = createBox(18*s, 14.5*s, 7*s, MAT.base);
    web.name = name.replace('EarBase','YokeWeb');
    web.position.set(0, 19.25*s, (z>0?9.5:-9.5)*s);
    upperArmGroup.add(web);
  }
  for (const [name,z] of [['elbowForkLeft',-10.5],['elbowForkRight',10.5]]) {
    const boss = createBoredDisc(pr.earBossRadius, P.boreElbow / 2, earPlateT, MAT.base);
    boss.name = name;
    boss.position.set(0,0,z*s);
    upperArmGroup.add(boss);
    const rib = createBox(9*s, 8*s, earPlateT*s, MAT.base);
    rib.name = name + 'Rib';
    rib.position.set(0,12*s,z*s);
    upperArmGroup.add(rib);
  }
  // O关节：Ø10×26可拆肩螺栓（头-耳片-1.0浮动-轴套-1.0浮动-耳片-平垫-尼龙自锁螺母）
  upperArmGroup.add(createShoulderBolt('elbow', pr.boltElbow, MAT.fastener));
  scene.add(upperArmGroup);

  // === 前臂：两段臂身 + 肘轴套(+毂) + 一体化D侧板叉耳 ===
  forearmGroup = new THREE.Group();
  forearmGroup.name = 'forearm';
  const syF = pr.spliceYForearm;
  // 近端段（两块，熔合为同一打印件）：
  //  · 杆身 y=0..-46 收窄为±5.5（顶部绕O开R5.4半圆缺口让开Ø10销轴），
  //    让开长条连杆端部R7.5扫掠圆（D点外侧留1.0mm）；矩形外形→凸包投影核验真实
  //  · 跟部 y=-46..拼接线 恢复±7（拼接凸台宽度一致）
  const shF = new THREE.Shape();
  const fpts = [[-5.5,0],[-5.4,0],'ARC_NOTCH',[5.4,0],[5.5,0],[5.5,-46],[-5.5,-46]];
  for (const [i,p] of fpts.entries()) {
    if (p === 'ARC_NOTCH') { shF.absarc(0, 0, 5.4*s, Math.PI, Math.PI*2, false); continue; }
    if (i === 0) shF.moveTo(p[0]*s, p[1]*s); else shF.lineTo(p[0]*s, p[1]*s);
  }
  shF.closePath();
  const gF = new THREE.ExtrudeGeometry(shF, { depth:12*s, bevelEnabled:false, steps:1, curveSegments: 32 });
  gF.translate(0,0,-6*s);
  const mF = new THREE.Mesh(gF, MAT.forearm);
  mF.name = 'forearmBodyProximal'; mF.castShadow = mF.receiveShadow = true;
  forearmGroup.add(mF);
  const gFhShape = new THREE.Shape();
  [[-7,-46],[7,-46],[7,syF],[-7,syF]].forEach(([x,y],i)=>{ if(i===0) gFhShape.moveTo(x*s,y*s); else gFhShape.lineTo(x*s,y*s); });
  gFhShape.closePath();
  const gFh = new THREE.ExtrudeGeometry(gFhShape, { depth:12*s, bevelEnabled:false, steps:1 });
  gFh.translate(0,0,-6*s);
  const mFh = new THREE.Mesh(gFh, MAT.forearm);
  mFh.name = 'forearmBodyProximalHeel'; mFh.castShadow = mFh.receiveShadow = true;
  forearmGroup.add(mFh);
  const gFdShape = new THREE.Shape();
  [[-7,syF],[7,syF],[7,-P.forearmLen],[-7,-P.forearmLen]].forEach(([x,y],i)=>{ if(i===0) gFdShape.moveTo(x*s,y*s); else gFdShape.lineTo(x*s,y*s); });
  gFdShape.closePath();
  const gFd = new THREE.ExtrudeGeometry(gFdShape, { depth:12*s, bevelEnabled:false, steps:1 });
  gFd.translate(0,0,-6*s);
  const mFd = new THREE.Mesh(gFd, MAT.forearm);
  mFd.name = 'forearmBodyDistal'; mFd.castShadow = mFd.receiveShadow = true;
  forearmGroup.add(mFd);
  addIntegralSplice(forearmGroup, 'forearmP', 'lead', syF, -1, 7, 6, MAT.forearm);
  addIntegralSplice(forearmGroup, 'forearmD', 'lag',  syF, -1, 7, 6, MAT.forearm);
  const endFlange = createZCylinder(12*s, 10*s, MAT.base, 32);
  endFlange.name = 'endFlange';
  endFlange.position.set(0,-P.forearmLen*s,0);
  forearmGroup.add(endFlange);

  // 肘轴套（整体更换件）Ø20/Ø10.6×14 + 内毂（Ø19盘，连接轴套与臂身，孔与销轴配合）
  const sleeveBody = createBushingRing(P.boreElbow, pr.sleeveOuterDia, pr.sleeveThickness, pr.chamfer, MAT.bearingDS);
  sleeveBody.name = 'elbowSleeveBody';
  forearmGroup.add(sleeveBody);
  const sleeveHub = createBoredDisc(9.5, P.boreElbow / 2, 12, MAT.forearm);
  sleeveHub.name = 'elbowSleeveHub';
  forearmGroup.add(sleeveHub);

  // D叉耳：双侧板（z=±6..10，完全在连杆z带|z|≤4之外）+ 内侧1mm定位凸台（设定1mm浮动）
  // 侧板贴臂身侧面熔合（同一打印件），取消v4跨连杆的dClevisBridge
  for (const [tag,zc] of [['Left',8],['Right',-8]]) {
    const arm = createPlateWithHoles(18, 10, 4, [[P.forearmAttachOffset - 9, 0, P.boreLink/2]], MAT.base);
    arm.name = 'dClevisArm' + tag;
    arm.position.set(9*s, -P.forearmAttachDist*s, zc*s);
    forearmGroup.add(arm);
    const boss = createBoredDisc(pr.dBossOD / 2, P.boreLink / 2, pr.dBossT, MAT.base);
    boss.name = 'dClevisBoss' + tag;
    boss.position.set(P.forearmAttachOffset*s, -P.forearmAttachDist*s, (zc>0?5.5:-5.5)*s);
    forearmGroup.add(boss);
  }
  // D关节：Ø8×20可拆肩螺栓（含两侧1mm定位凸台 → 光杆20）
  const dBolt = createShoulderBolt('d', pr.boltD, MAT.fastener);
  dBolt.position.set(P.forearmAttachOffset*s, -P.forearmAttachDist*s, 0);
  forearmGroup.add(dBolt);
  scene.add(forearmGroup);

  // === Ø36圆柱直线电机：前法兰承推 + 后部开口抱箍 + 端部螺纹推杆 ===
  motorGroup = new THREE.Group();
  motorGroup.name = 'motor';
  const bodyLen = P.motorBodyLen, rearY = P.motorMountY + P.motorRearOverhang, frontY = P.motorFrontY;
  const motorBody = createCylinder(P.motorBodyRadius*s, bodyLen*s, MAT.motorBody, 48);
  motorBody.name = 'motorBody';
  motorBody.position.set(P.motorMountX*s, (frontY + rearY)/2*s, 0);
  motorGroup.add(motorBody);
  const rearCap = createCylinder(P.motorBodyRadius*s, 4*s, MAT.base, 48);
  rearCap.name = 'motorRearCap';
  rearCap.position.set(P.motorMountX*s, (rearY - 2)*s, 0);
  motorGroup.add(rearCap);
  const frontCap = createCylinder(P.motorBodyRadius*s, 4*s, MAT.base, 48);
  frontCap.name = 'motorFrontCap';
  frontCap.position.set(P.motorMountX*s, (frontY + 2)*s, 0);
  motorGroup.add(frontCap);
  // 电机前法兰（Ø39×4，承推于安装板下面，4×M4向上旋入安装板）
  const flange = createDiscWithHoles(19, pr.flangeBoltXZ.map(([bx,bz]) => [bx - P.motorMountX, bz, 2.3]), 4, MAT.base);
  flange.name = 'motorFlange';
  flange.rotation.x = Math.PI / 2;
  flange.position.set(P.motorMountX*s, (frontY + 4)*s, 0);
  motorGroup.add(flange);
  pr.flangeBoltXZ.forEach(([bx,bz],i) => {
    const n = String(i+1);
    const bolt = createCylinder(pr.collarBolt.shank/2*s, 12*s, MAT.fastener, 20);
    bolt.name = 'flangeBolt' + n;
    bolt.position.set(bx*s, (frontY + 6)*s, bz*s);
    motorGroup.add(bolt);
    const head = createCylinder(3.5*s, 4*s, MAT.fastener, 24);   // 轴沿Y（Cylinder默认轴向Y）
    head.name = 'flangeBoltHead' + n;
    head.position.set(bx*s, (frontY - 2)*s, bz*s);
    motorGroup.add(head);
  });

  // 后部开口抱箍（独立打印件）：300°包角、60°开口朝臂侧，2×M4贯穿上臂侧面
  const Rin = P.motorBodyRadius + pr.ringClearance, Rout = Rin + pr.collarWall;
  const gapRad = pr.collarGapDeg * Math.PI / 180;
  const a0 = Math.PI - gapRad / 2;                    // 150°
  const ringShape = new THREE.Shape();
  ringShape.absarc(0, 0, Rout, a0, a0 + Math.PI*2 - gapRad, false);
  ringShape.absarc(0, 0, Rin, a0 + Math.PI*2 - gapRad, a0, true);
  ringShape.closePath();
  const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: pr.collarY1 - pr.collarY0, bevelEnabled: false, steps: 1, curveSegments: 48 });
  ringGeo.scale(s, s, s);
  const collarRing = new THREE.Mesh(ringGeo, MAT.clamp);
  collarRing.name = 'collarRing';
  collarRing.castShadow = collarRing.receiveShadow = true;
  collarRing.rotation.x = Math.PI / 2;                // 截面→世界XZ，挤出→世界-y
  collarRing.position.set(P.motorMountX*s, pr.collarY1*s, 0);
  motorGroup.add(collarRing);
  // 抱箍耳板：从开口边缘延伸到上臂侧面（z=±7..11），随R18.2内圆避让缸体，M4贯穿孔
  function collarTabShape() {
    const sh = new THREE.Shape();
    const zA = 7, zB = 11;
    const uA = -Math.sqrt(Rin*Rin - zA*zA), uB = -Math.sqrt(Rin*Rin - zB*zB);
    const aA = Math.atan2(zA, uA), aB = Math.atan2(zB, uB);
    sh.moveTo(-30, zA); sh.lineTo(uA, zA);
    sh.absarc(0, 0, Rin, aA, aB, true);
    sh.lineTo(-30, zB); sh.closePath();
    const p = new THREE.Path(); p.absarc(-26, (zA+zB)/2, pr.collarBolt.shank/2 + 0.2, 0, Math.PI*2, true);
    sh.holes.push(p);
    return sh;
  }
  [['Left', pr.collarBoltY[0] + 6], ['Right', pr.collarBoltY[1] + 6]].forEach(([tag, yTop]) => {
    const tabGeo = new THREE.ExtrudeGeometry(collarTabShape(), { depth: 12, bevelEnabled: false, steps: 1, curveSegments: 32 });
    tabGeo.scale(s, s, s);
    const tab = new THREE.Mesh(tabGeo, MAT.clamp);
    tab.name = 'collarTab' + tag;
    tab.castShadow = tab.receiveShadow = true;
    tab.rotation.x = Math.PI / 2;
    tab.position.set(P.motorMountX*s, yTop*s, 0);
    motorGroup.add(tab);
  });
  pr.collarBoltY.forEach((y, i) => {
    const tag = ['A','B'][i];
    const bolt = createZCylinder(pr.collarBolt.shank/2*s, (2*11)*s, MAT.fastener, 20);
    bolt.name = 'collarBoltShank' + tag;
    bolt.position.set(2*s, y*s, 0);
    motorGroup.add(bolt);
    const head = createZCylinder(pr.collarBolt.head/2*s, pr.collarBolt.headT*s, MAT.fastener, 24);
    head.name = 'collarBoltHead' + tag;
    head.position.set(2*s, y*s, (11 + pr.collarBolt.headT/2)*s);
    motorGroup.add(head);
    const washer = createZCylinder(pr.collarBolt.washer/2*s, 1.6*s, MAT.fastener, 20);
    washer.name = 'collarBoltWasher' + tag;
    washer.position.set(2*s, y*s, -(11 + 0.8)*s);
    motorGroup.add(washer);
    const nut = createZHexNut(pr.collarBolt.nutAF, pr.collarBolt.nutH, MAT.fastener);
    nut.name = 'collarBoltNut' + tag;
    nut.position.set(2*s, y*s, -(11 + 1.6 + pr.collarBolt.nutH/2)*s);
    motorGroup.add(nut);
  });

  // 推杆：Ø8光杆 + 端部M6螺纹段（旋入叉头沉龛内的M6螺母，螺母由沉龛六角定位、底板承推）
  const rodGroup = new THREE.Group();
  rodGroup.name = 'motorRod';
  const rod = createCylinder(4*s, 100*s, MAT.motorRod, 32);
  rod.name = 'exposedRod';
  rodGroup.add(rod);
  const rodThread = createCylinder(3.1*s, pr.rodThreadLen*s, MAT.motorRod, 24);
  rodThread.name = 'rodThreadStub';
  rodGroup.add(rodThread);

  // B推杆叉头（唯一独立运动附件）：开放双耳 + 夹持桥（M6螺母沉龛）
  //   连杆端部（|z|≤4）沿Z落入两耳之间（耳内档10，1mm/侧浮动）；销轴沿Z插入。
  //   夹持桥位于B点上方y=9..16，完全避开连杆端部R7.5扫掠圆（间隙1.5mm）。
  const bClevis = new THREE.Group();
  bClevis.name = 'bClevis';
  const pocketX = 5.8, pocketZ = 5.2, by0 = pr.bridgeY0, by1 = pr.bridgeY1;
  const mmBox = (w, h, d) => createBox(w * s, h * s, d * s, MAT.clamp);
  const addB = (mesh, name, x, y, z) => { mesh.name = name; mesh.position.set(x*s, y*s, z*s); bClevis.add(mesh); };
  addB(mmBox(18, 2, 18), 'bClevisBridgeFloor', 0, (by0 + 1), 0);                 // 螺母承推底板
  addB(mmBox(18, 5, 2*(9 - pocketZ)), 'bClevisBridgeWallZP', 0, (by0+by1)/2 + 0.5, (pocketZ + 9)/2);
  addB(mmBox(18, 5, 2*(9 - pocketZ)), 'bClevisBridgeWallZN', 0, (by0+by1)/2 + 0.5, -(pocketZ + 9)/2);
  addB(mmBox(2*(9 - pocketX), 5, 2*pocketZ), 'bClevisBridgeWallXP', (pocketX + 9)/2, (by0+by1)/2 + 0.5, 0);
  addB(mmBox(2*(9 - pocketX), 5, 2*pocketZ), 'bClevisBridgeWallXN', -(pocketX + 9)/2, (by0+by1)/2 + 0.5, 0);
  addB(mmBox(2, 2.5, 2*pocketZ), 'bClevisBridgeRibL', -3.5, by0 + 1.25, 0);      // 底板加强肋（底8.5，距连杆扫掠1.0）
  addB(mmBox(2, 2.5, 2*pocketZ), 'bClevisBridgeRibR', 3.5, by0 + 1.25, 0);
  for (const [tag,z] of [['Left', pr.clevisPlateZ],['Right', -pr.clevisPlateZ]]) {
    const arm = createPlateWithHoles(16, 11.5, 4, [], MAT.clamp);
    arm.name = 'bClevisArm' + tag;
    arm.position.set(0, 10.25*s, z*s);
    bClevis.add(arm);
    const plate = createBoredDisc(8, P.boreLink / 2, 4, MAT.clamp);
    plate.name = 'bClevisPlate' + tag;
    plate.position.z = z*s;
    bClevis.add(plate);
  }
  // 沉龛内的M6螺母（对边10，六角面朝±z防转；底面承推于y=11底板）
  const bRodNut = createCylinder(pr.nutPocketAF / Math.sqrt(3) * s, 5*s, MAT.fastener, 6);
  bRodNut.name = 'bRodNut';
  bRodNut.position.set(0, (by0 + 2.5)*s, 0);
  bClevis.add(bRodNut);
  // B关节：Ø8×18可拆肩螺栓
  bClevis.add(createShoulderBolt('b', pr.boltB, MAT.fastener));
  rodGroup.add(bClevis);
  motorGroup.add(rodGroup);
  scene.add(motorGroup);

  // === BD等宽长条连杆（100×15×8，R7.5圆弧端，Ø8.6打印直孔+45°倒角） ===
  tendonGroup = new THREE.Group();
  tendonGroup.name = 'tendonGroup';
  const eyeR = pr.linkWidth / 2;                                     // 7.5，端部圆弧=杆身同宽
  const webHalf = P.tendonLinkLen / 2 - P.boreLink / 2;              // 38.2：杆身端面与端孔环面接触熔合
  const tendonWeb = createBox(pr.linkWidth*s, 2*webHalf*s, pr.linkThickness*s, MAT.tendon);
  tendonWeb.name = 'tendonWeb';
  tendonGroup.add(tendonWeb);
  for (const [joint,localY] of [['B',P.tendonLinkLen/2],['D',-P.tendonLinkLen/2]]) {
    // 端部环：外径=杆宽（等宽长条轮廓），Ø8.6孔+45°导入倒角，孔壁3.2mm
    const eye = createBushingRing(P.boreLink, pr.linkWidth, pr.linkThickness, pr.chamfer, MAT.bushingDS);
    eye.name = 'tendonEye' + joint;
    eye.position.y = localY*s;
    tendonGroup.add(eye);
  }
  scene.add(tendonGroup);

  buildBodyOutline();
  updateTrail();
}

function buildBodyOutline() {
  bodyOutline = new THREE.Group();
  bodyOutline.name = 'bodyOutline';
  const upperOutline = createCylinder(18 * s, P.upperArmLen * s, MAT.body, 24);
  upperOutline.position.y = (P.upperArmLen / 2) * s;
  bodyOutline.add(upperOutline);
  const lowerOutline = createCylinder(15 * s, P.forearmLen * s, MAT.body, 24);
  lowerOutline.name = 'lowerOutline';
  lowerOutline.position.y = -P.forearmLen * s / 2;
  bodyOutline.add(lowerOutline);
  const shoulderBall = createSphere(20 * s, MAT.body, 20);
  shoulderBall.position.y = P.upperArmLen * s;
  bodyOutline.add(shoulderBall);
  const elbowBall = createSphere(16 * s, MAT.body, 20);
  bodyOutline.add(elbowBall);
  scene.add(bodyOutline);
}

function createTextSprite(text, color) {
  color = color || '#7c8aff';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 36px Arial';
  const w = ctx.measureText(text).width + 20;
  canvas.width = w; canvas.height = 50;
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = color;
  ctx.fillText(text, 10, 38);
  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(w * 0.15, 50 * 0.15, 1);
  return sprite;
}

function updateLabels() {
  labels.forEach(l => {
    scene.remove(l);
    if (l.material.map) l.material.map.dispose();
    l.material.dispose();
  });
  labels = [];
  if (!showLabels) return;
  const labelA = createTextSprite('A 电机行程基准', '#ff8844');
  labelA.position.set(P.motorMountX * s + 15, P.motorMountY * s, 15);
  scene.add(labelA); labels.push(labelA);
  const labelO = createTextSprite('O 肘关节', '#ffaa44');
  labelO.position.set(20, 10, 15);
  scene.add(labelO); labels.push(labelO);
  const D = getDPoint(currentAngle);
  const labelD = createTextSprite('D 可拆销轴', '#44ff88');
  labelD.position.set(D.x * s + 15, D.y * s, 15);
  scene.add(labelD); labels.push(labelD);
  const labelB = createTextSprite('B 推杆叉头销轴', '#ff66aa');
  const sm = angleToStroke(currentAngle);
  labelB.position.set(P.motorMountX * s + 15, (P.motorMountY - sm) * s, 15);
  scene.add(labelB); labels.push(labelB);
  const labelAngle = createTextSprite('theta = ' + currentAngle.toFixed(1) + ' deg', '#7c8aff');
  labelAngle.position.set(-40 * s, -60 * s, 20);
  scene.add(labelAngle); labels.push(labelAngle);
}

function updateTrail() {
  if (trailLine) scene.remove(trailLine);
  if (!showTrail) return;
  const points = [];
  for (let a = 0; a <= 120; a += 3) {
    const D = getDPoint(a);
    points.push(new THREE.Vector3(D.x * s, D.y * s, 0));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  trailLine = new THREE.Line(geo, MAT.trail);
  scene.add(trailLine);
}

// --- 更新机构位置 ---
function updateMechanism(angleDeg) {
  currentAngle = Math.max(0, Math.min(120, Number(angleDeg)));
  angleDeg = currentAngle;
  const theta = angleDeg * Math.PI / 180;
  const sMotor = angleToStroke(angleDeg);
  const stroke = P.s_extended - sMotor;

  forearmGroup.rotation.z = theta;
  if (bodyOutline) {
    const lo = bodyOutline.getObjectByName('lowerOutline');
    if (lo) {
      lo.rotation.z = theta;
      lo.position.set(P.forearmLen * s / 2 * Math.sin(theta), -P.forearmLen * s / 2 * Math.cos(theta), 0);
    }
  }

  // B点 = (Ax, Ay - s)
  const Bx = P.motorMountX;
  const By = P.motorMountY - sMotor;
  const D = getDPoint(angleDeg);
  const noseY = P.motorFrontY;

  // 推杆：Ø8光杆（电机前盖→螺纹段）+ 端部M6螺纹段（伸入叉头沉龛螺母）
  const rod = motorGroup.getObjectByName('exposedRod');
  const rodThread = motorGroup.getObjectByName('rodThreadStub');
  const bClevis = motorGroup.getObjectByName('bClevis');
  if (rod) {
    const rodLen8 = noseY - (By + P.print.rodTipAboveB + P.print.rodThreadLen);   // Ø8光杆外露长
    rod.visible = rodLen8 > 0.5;
    rod.scale.y = Math.max(0.001, rodLen8) / 100;
    rod.position.set(Bx*s, (noseY + By + P.print.rodTipAboveB + P.print.rodThreadLen)/2*s, 0);
  }
  if (rodThread) {
    const stubLen = Math.min(P.print.rodThreadLen, noseY - (By + P.print.rodTipAboveB));
    rodThread.visible = stubLen > 0.2;
    rodThread.scale.y = Math.max(0.001, stubLen) / P.print.rodThreadLen;
    rodThread.position.set(Bx*s, (By + P.print.rodTipAboveB + stubLen/2)*s, 0);
  }
  if (bClevis) bClevis.position.set(Bx*s,By*s,0);

  // 整根等宽长条BD连杆作为刚体更新，中心距恒为P.tendonLinkLen。
  const midX = (Bx + D.x)/2*s;
  const midY = (By + D.y)/2*s;
  tendonGroup.position.set(midX,midY,0);
  tendonGroup.rotation.z = Math.atan2(D.x-Bx,-(D.y-By));
  tendonGroup.scale.set(1,1,1);

  updateLabels();
  updateLiveData(angleDeg, stroke, sMotor);
}

  const mu = transmissionAngle(angle);
  const f = getForceData(angle);
  document.getElementById('live-data').innerHTML =

    '<b>回缩行程</b>: <span class="highlight">' + stroke.toFixed(2) + ' mm</span> / ' + P.strokeMax.toFixed(2) + ' mm<br>' +
    '<b>A–B安装距离</b>: ' + sMotor.toFixed(2) + ' mm（非行程）<br>' +
    '<b>锐角传动角</b>: ' + mu.toFixed(1) + '°<br>' +
    '<b>理想静态拉力</b>: ' + f.forceN.toFixed(1) + ' N（5kg演示）<br>' +
    '<b>负载力矩</b>: ' + f.torqueNm.toFixed(2) + ' N·m<br>' +

}

function animate() {
  requestAnimationFrame(animate);
  if (isPlaying) {
    currentAngle += animDir * animSpeed * 0.5;
    if (currentAngle >= 120) { currentAngle = 120; animDir = -1; }
    if (currentAngle <= 0) { currentAngle = 0; animDir = 1; }
    document.getElementById('angle-slider').value = currentAngle;
    document.getElementById('stroke-slider').value = getStrokeFromAngle(currentAngle);
    updateMechanism(currentAngle);
    updateSliderLabels();
  }
  controls.update();
  renderer.render(scene, camera);
}

function updateSliderLabels() {
  document.getElementById('angle-val').textContent = currentAngle.toFixed(1) + '°';
  document.getElementById('stroke-val').textContent = getStrokeFromAngle(currentAngle).toFixed(1) + ' mm';
  document.getElementById('speed-val').textContent = animSpeed.toFixed(1) + 'x';
}

function setupUI() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('control-panel').style.display = 'block';
  updateBioInfo();
  updateParamInfo();
  updatePrintInfo();
  const angleSlider = document.getElementById('angle-slider');
  const strokeSlider = document.getElementById('stroke-slider');
  strokeSlider.max = String(P.strokeMax);
  strokeSlider.step = 'any';
  const speedSlider = document.getElementById('speed-slider');

  angleSlider.addEventListener('input', function(e) {
    isPlaying = false;
    document.getElementById('btn-play').textContent = '▶ 播放';
    currentAngle = parseFloat(e.target.value);
    strokeSlider.value = getStrokeFromAngle(currentAngle);
    updateMechanism(currentAngle);
    updateSliderLabels();
  });
  strokeSlider.addEventListener('input', function(e) {
    isPlaying = false;
    document.getElementById('btn-play').textContent = '▶ 播放';
    currentAngle = strokeToAngle(parseFloat(e.target.value));
    angleSlider.value = currentAngle;
    updateMechanism(currentAngle);
    updateSliderLabels();
  });
  speedSlider.addEventListener('input', function(e) {
    animSpeed = parseFloat(e.target.value);
    updateSliderLabels();
  });
  document.getElementById('btn-play').addEventListener('click', function() {
    isPlaying = !isPlaying;
    document.getElementById('btn-play').textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
  });
  document.getElementById('btn-reset').addEventListener('click', function() {
    isPlaying = false;
    document.getElementById('btn-play').textContent = '▶ 播放';
    currentAngle = 0;
    angleSlider.value = 0;
    strokeSlider.value = 0;
    updateMechanism(0);
    updateSliderLabels();
  });
  document.getElementById('btn-view-iso').addEventListener('click', function() { animateCamera(150, 55, 310); });
  document.getElementById('btn-view-front').addEventListener('click', function() { animateCamera(0, 20, 330); });
  document.getElementById('btn-view-side').addEventListener('click', function() { animateCamera(330, 20, 0.1); });
  document.getElementById('show-grid').addEventListener('change', function(e) {
    showGrid = e.target.checked;
    var g = scene.getObjectByName('grid');
    if (g) g.visible = showGrid;
  });
  document.getElementById('show-labels').addEventListener('change', function(e) { showLabels = e.target.checked; updateLabels(); });
  document.getElementById('show-trail').addEventListener('change', function(e) { showTrail = e.target.checked; updateTrail(); });
  document.getElementById('show-body').addEventListener('change', function(e) { showBody = e.target.checked; if (bodyOutline) bodyOutline.visible = showBody; });
  updateSliderLabels();
}

function animateCamera(tx, ty, tz) {
  var start = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
  var end = { x: tx, y: ty, z: tz };
  var duration = 800;
  var startTime = Date.now();
  function step() {
    var elapsed = Date.now() - startTime;
    var t = Math.min(elapsed / duration, 1);
    var ease = t * (2 - t);
    camera.position.x = start.x + (end.x - start.x) * ease;
    camera.position.y = start.y + (end.y - start.y) * ease;
    camera.position.z = start.z + (end.z - start.z) * ease;
    camera.lookAt(0, 50 * s, 0);
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

initScene();
buildMechanism();
updateMechanism(0);
setupUI();
animate();
